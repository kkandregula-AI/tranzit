  <script>
    (function(){
      var c=document.createElement("canvas");c.width=512;c.height=512;
      var x=c.getContext("2d");

      var g=x.createLinearGradient(0,0,512,512);
      g.addColorStop(0,"#0A0A0F");g.addColorStop(1,"#1A1A28");
      x.fillStyle=g;x.beginPath();x.roundRect(0,0,512,512,96);x.fill();

      x.fillStyle=rg;x.fillRect(0,0,512,512);
      // T lettermark
      var tg=x.createLinearGradient(100,140,420,380);
      tg.addColorStop(0,"#FF6B1A");tg.addColorStop(1,"#F5A623");
      x.fillStyle=tg;
      // Horizontal bar of T
      x.beginPath();x.roundRect(90,130,332,72,18);x.fill();
      // Vertical stem of T
      x.beginPath();x.roundRect(210,130,92,252,18);x.fill();
      // Route dots — three small circles below
      [156,256,356].forEach(function(cx,i){
        x.beginPath();x.arc(cx,420,18,0,Math.PI*2);
        x.fillStyle=i===1?"#F5A623":"rgba(255,107,26,0.5)";x.fill();
      });
      // Connecting line between dots
      x.strokeStyle="rgba(245,166,35,0.4)";x.lineWidth=6;x.lineCap="round";
      x.beginPath();x.moveTo(174,420);x.lineTo(238,420);x.stroke();
      x.beginPath();x.moveTo(274,420);x.lineTo(338,420);x.stroke();
      var url=c.toDataURL("image/png");
      // Favicon
      var lnk=document.createElement("link");lnk.rel="icon";lnk.type="image/png";lnk.href=url;document.head.appendChild(lnk);
      // Apple touch icon
      var al=document.createElement("link");al.rel="apple-touch-icon";al.href=url;document.head.appendChild(al);

      var manifest={name:"Tranzit",short_name:"Tranzit",start_url:".",display:"standalone",background_color:"#0A0A0F",theme_color:"#FF6B1A",icons:[{src:url,sizes:"512x512",type:"image/png"}]};

      var ml=document.createElement("link");ml.rel="manifest";ml.href=URL.createObjectURL(mb);document.head.appendChild(ml);

// Deep link launcher with app-store fallback
function launchRideApp(app, dest) {
  const destEnc = encodeURIComponent(dest||"");
  let deep = app.deep;
  if (deep) {
    // Append destination where supported
    if (deep.includes("uber://")) deep += `&dropoff[nickname]=${destEnc}`;
    if (deep.includes("grab://")) deep += `&dropName=${destEnc}`;
    const start = Date.now();
    window.location.href = deep;
    setTimeout(() => {
      if (Date.now() - start < 2000) {
        // App didn't open — go to store
        const ua = navigator.userAgent;
        const url = /iPhone|iPad|iPod/.test(ua) ? (app.store?.ios||app.web) : (app.store?.android||app.web);
        window.open(url, "_blank");
      }
    }, 1500);
  } else {
    window.open(app.web, "_blank");
  }
}

// ── PERSISTENT ROUTE CACHE (localStorage, 24hr TTL) ──────────────────────────
const ROUTE_CACHE_STORAGE = "tranzit_route_cache_v2";
const CACHE_TTL_MS = 24 * 60 * 60 * 1000; // 24 hours

const _loadCache = () => {
  try {
    const raw = JSON.parse(localStorage.getItem(ROUTE_CACHE_STORAGE) || "{}");
    const now = Date.now();
    const valid = {};
    let purged = 0;
    Object.entries(raw).forEach(([k, v]) => {
      if (v.timestamp && (now - v.timestamp) < CACHE_TTL_MS) valid[k] = v;
      else purged++;
    });
    if (purged > 0) localStorage.setItem(ROUTE_CACHE_STORAGE, JSON.stringify(valid));
    return valid;
  } catch { return {}; }
};

// Live cache object — shared across the app, pre-loaded from localStorage
const ROUTE_CACHE = _loadCache();

const _saveCache = (key, routes, tokens) => {
  ROUTE_CACHE[key] = { routes, tokens, timestamp: Date.now() };
  try {
    localStorage.setItem(ROUTE_CACHE_STORAGE, JSON.stringify(ROUTE_CACHE));
  } catch(e) {
    // Quota exceeded — prune oldest 30% entries
    const sorted = Object.entries(ROUTE_CACHE).sort((a,b)=>a[1].timestamp-b[1].timestamp);
    sorted.slice(0, Math.ceil(sorted.length*0.3)).forEach(([k])=>delete ROUTE_CACHE[k]);
    try { localStorage.setItem(ROUTE_CACHE_STORAGE, JSON.stringify(ROUTE_CACHE)); } catch{}
  }
};

// ── MODEL FALLBACK CHAIN ──────────────────────────────────────────────────────
// Ordered from newest → oldest. App tries each in sequence if one is deprecated/errors.
const MODEL_CHAIN = [
  { id:"claude-sonnet-4-6",   label:"Sonnet 4.6",  status:"active"  },
  { id:"claude-sonnet-4-5-20250929", label:"Sonnet 4.5", status:"active" },

  { id:"claude-haiku-4-5-20251001",  label:"Haiku 4.5",  status:"active" },
];
const MODEL_STORAGE = "tranzit_active_model";

// Active model — persisted so we don't re-probe on every reload
let ACTIVE_MODEL = (() => {
  const saved = localStorage.getItem(MODEL_STORAGE);
  const match = MODEL_CHAIN.find(m => m.id === saved);
  return match || MODEL_CHAIN[0];
})();

// Deprecated/retired HTTP status codes & error patterns
const isDeprecatedError = (status, errMsg) =>
  status === 404 ||
  (errMsg && /deprecated|retired|not found|invalid model|model_not_found/i.test(errMsg));

// Try each model in chain until one works; update ACTIVE_MODEL on success
async function callWithFallback(apiKey, bodyFn, onModelChange) {
  const startIdx = MODEL_CHAIN.findIndex(m => m.id === ACTIVE_MODEL.id);
  const orderedChain = [
    ...MODEL_CHAIN.slice(startIdx),
    ...MODEL_CHAIN.slice(0, startIdx),
  ];

  for (const model of orderedChain) {
    const body = bodyFn(model.id);
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-api-key":apiKey,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body: JSON.stringify(body)
    });

    if (res.ok) {
      // Update active model if it changed
      if (model.id !== ACTIVE_MODEL.id) {
        ACTIVE_MODEL = model;
        localStorage.setItem(MODEL_STORAGE, model.id);
        onModelChange && onModelChange(model);
      }
      return { res, model };
    }

    const errData = await res.json().catch(()=>({}));
    const errMsg  = errData.error?.message || "";

    if (res.status === 401) throw new Error("AUTH_FAILED");
    if (isDeprecatedError(res.status, errMsg)) {
      console.warn(`[Tranzit] Model ${model.id} deprecated/retired — trying next…`);
      continue; // try next model
    }
    // Other error (rate limit, server error) — throw immediately
    throw new Error(errMsg || `HTTP ${res.status}`);
  }
  throw new Error("All models in fallback chain failed. Please try again.");
}

function cacheKey(cityCode, from, to) {
  return `${cityCode}|${from.trim().toLowerCase()}|${to.trim().toLowerCase()}`;
}

// Helper: how old is a cache entry
const cacheAge = (entry) => {
  const ms = Date.now() - (entry.timestamp||0);
  if (ms < 3600000) return `${Math.round(ms/60000)}m ago`;
  if (ms < 86400000) return `${Math.round(ms/3600000)}h ago`;
  return `${Math.round(ms/86400000)}d ago`;
};

// ── FREE ROUTING (Nominatim geocode + OSRM routing) ─────────────────────────
// No API key required — uses OpenStreetMap data

const OSM_PROFILES = {
  // profile = OSRM routing profile to use
  // multiplier = traffic/behaviour adjustment applied to raw OSRM time
  // note = shown to user explaining the adjustment
  walk:  {profile:"foot", multiplier:1.0,  note:""},
  cycle: {profile:"bike", multiplier:1.05, note:"Includes stopping at lights"},
  bike:  {profile:"car",  multiplier:0.80, note:"Bikes filter through traffic — faster than car"},
  auto:  {profile:"car",  multiplier:1.10, note:"Autos make frequent stops and use narrow lanes"},
  car:   {profile:"car",  multiplier:1.0,  note:""},
  // Rule: car OSRM time is always faster than foot OSRM time for same route
  // Never inflate car above foot — that's physically impossible
};

async function nominatimSearch(query, lat, lng, radiusKm=5) {
  const box = `${lng-radiusKm*0.01},${lat+radiusKm*0.01},${lng+radiusKm*0.01},${lat-radiusKm*0.01}`;
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=3&viewbox=${box}&bounded=0&accept-language=en`;
  const res = await fetch(url, {headers:{"User-Agent":"Tranzit-App/1.0"}});
  const data = await res.json();
  return data.length ? {lat:parseFloat(data[0].lat), lng:parseFloat(data[0].lon), name:data[0].display_name} : null;
}

async function osrmRouteTime(fromLat, fromLng, toLat, toLng, profile) {
  const url = `https://router.project-osrm.org/route/v1/${profile}/${fromLng},${fromLat};${toLng},${toLat}?overview=false`;
  try {
    const res = await fetch(url, {signal: makeSignal(8000)});
    const data = await res.json();
    if(data.code !== "Ok" || !data.routes?.[0]) return null;
    return Math.ceil(data.routes[0].duration / 60);
  } catch(e) { return null; }
}

// Main: get real routing time from user coords to a station
async function getStationRouteTime(userLat, userLng, stationName, cityName, mode) {
  const modeConfig = OSM_PROFILES[mode] || OSM_PROFILES.walk;
  const profile = modeConfig.profile;
  const multiplier = modeConfig.multiplier;
  const station = await nominatimSearch(`${stationName} ${cityName}`, userLat, userLng);
  if(!station) return null;
  const rawMins = await osrmRouteTime(userLat, userLng, station.lat, station.lng, profile);
  if(rawMins===null) return null;
  let adjustedMins = Math.max(1, Math.round(rawMins * multiplier));

  // Sanity check: motorised modes (bike/auto/car) must be faster than walking
  // If not, recalculate walking time and cap accordingly
  if(["bike","auto","car"].includes(mode)) {
    const walkRaw = await osrmRouteTime(userLat, userLng, station.lat, station.lng, "foot");
    if(walkRaw && adjustedMins >= walkRaw) {
      // Cap motorised time at 80% of walking time (they're always faster)
      adjustedMins = Math.max(1, Math.round(walkRaw * 0.80));
    }
  }

  return {mins: adjustedMins, stationCoords:{lat:station.lat, lng:station.lng}, note:modeConfig.note};
}

// ── INSTANT LOCAL NEAREST STATION — pure Haversine, zero network ──────────────
function findNearestStationLocal(lat, lng, cityCode) {
  const stations = STATION_COORDS[cityCode];
  if(!stations || !stations.length) return null;
  let best = null, bestDist = Infinity;
  for(const s of stations) {
    const d = haversineKm(lat, lng, s.lat, s.lng);
    if(d < bestDist) { bestDist = d; best = s; }
  }
  return best ? {...best, distKm: bestDist.toFixed(2)} : null;
}

function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ── FIND NEAREST METRO STATION via Overpass API ──────────────────────────────
async function findNearestMetroStation(lat, lng, cityName, radiusM=5000) {

  // Strategy 1: Overpass — query ALL railway stations + public_transport stations
  // Cast wide net then filter by name containing metro-related keywords
  const queries = [
    // Tagged as subway/metro explicitly
    `[out:json][timeout:15];(node["station"="subway"](around:${radiusM},${lat},${lng});node["railway"="station"]["station"="subway"](around:${radiusM},${lat},${lng}););out body;`,
    // Any railway station — we'll filter by name
    `[out:json][timeout:15];(node["railway"="station"](around:${radiusM},${lat},${lng});node["public_transport"="station"](around:${radiusM},${lat},${lng}););out body;`,
    // Broader: any railway stop
    `[out:json][timeout:15];(node["railway"~"station|halt|stop"](around:${radiusM},${lat},${lng}););out body;`,
  ];

  for(const q of queries) {
    try {
      const res = await fetch(
        `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(q)}`,
        {headers:{"User-Agent":"Tranzit-App/1.0"}, signal:makeSignal(10000)}
      );
      const data = await res.json();
      if(!data.elements?.length) continue;

      // Filter to likely metro stations (name contains metro/rail/MRT/subway keywords or city metro names)
      const metroKeywords = /metro|subway|mrt|mrts|dmrc|hmrl|rapid|rail/i;
      let candidates = data.elements.filter(n=>
        n.lat && n.lon &&
        (n.tags?.name||n.tags?.["name:en"]) &&
        (metroKeywords.test(n.tags?.name||"") ||
         metroKeywords.test(n.tags?.network||"") ||
         metroKeywords.test(n.tags?.operator||"") ||
         n.tags?.station==="subway" ||
         n.tags?.["public_transport"]==="station")
      );

      // If no metro-keyword match, fall back to all stations from this query
      if(!candidates.length) candidates = data.elements.filter(n=>n.lat&&n.lon&&(n.tags?.name||n.tags?.["name:en"]));
      if(!candidates.length) continue;

      // Sort by Haversine distance
      const sorted = candidates.map(n=>({
        ...n,
        name:(n.tags?.["name:en"]||n.tags?.name||"").trim(),
        distKm:haversineKm(lat,lng,n.lat,n.lon),
      })).sort((a,b)=>a.distKm-b.distKm);

      if(sorted.length && sorted[0].name) {
        const best = sorted[0];
        return {lat:best.lat, lng:best.lon, name:best.name, distKm:best.distKm.toFixed(2)};
      }
    } catch(e) { continue; }
  }

  // Strategy 2: Nominatim fallback with Haversine sort
  const nmQueries = ["metro station","subway station","railway station"];
  for(const q of nmQueries){
    try{
      const url=`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q+" "+cityName)}&format=json&limit=15&accept-language=en`;
      const res=await fetch(url,{headers:{"User-Agent":"Tranzit-App/1.0"}});
      const items=await res.json();
      if(!items.length) continue;
      const sorted=items.map(i=>({...i,distKm:haversineKm(lat,lng,parseFloat(i.lat),parseFloat(i.lon))})).sort((a,b)=>a.distKm-b.distKm);
      const best=sorted[0];
      if(best.distKm<10){
        let name=best.display_name.split(",")[0].trim().replace(/([a-z])([A-Z])/g,"$1 $2").trim();
        return {lat:parseFloat(best.lat),lng:parseFloat(best.lon),name,distKm:best.distKm.toFixed(2)};
      }
    }catch(e){continue;}
  }
  return null;
}

  const {res} = await callWithFallback(

// ── SAFE ABORT SIGNAL — works on all Safari versions ─────────────────────────
function makeSignal(ms) {
  // AbortSignal.timeout only in Safari 16+; polyfill for older versions
  if(typeof AbortSignal !== "undefined" && AbortSignal.timeout) {
    return AbortSignal.timeout(ms);
  }
  const ctrl = new AbortController();
  setTimeout(()=>ctrl.abort(), ms);
  return ctrl.signal;
}
async function geocodeAddress(address, cityName) {
  const q = encodeURIComponent(`${address}, ${cityName}`);
  const url = `https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1&accept-language=en`;
  try {
    const res = await fetch(url, {headers:{"User-Agent":"Tranzit-App/1.0"}, signal:makeSignal(6000)});
    const data = await res.json();
    if(data.length) return {lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon)};
  } catch(e) {}
  return null;
}

async function fetchAIRoutes(city, from, to, apiKey, onTokenUpdate, onModelChange) {
  const key = cacheKey(city.code, from, to);

  // Cache HIT → return instantly, credit saved tokens
  if (ROUTE_CACHE[key]) {
    const cached = ROUTE_CACHE[key];
    TOKEN_SESSION.saved += cached.tokens || 700;
    onTokenUpdate && onTokenUpdate({ ...TOKEN_SESSION });
    return { routes: cached.routes, fromCache: true, cacheAge: cacheAge(cached), tokensSaved: cached.tokens };
  }

  const prompt = `Transit expert: ${city.name}, ${city.country}. System: ${city.transitLabel}. Currency: ${city.currency}.
5 routes from "${from}" to "${to}". Raw JSON array only, no markdown.
Each: {"id":"str","icon":"emoji","label":"name","via":"real stops","time":int,"fare":num,"crowd":int,"reliability":int,"delay":int,"co2":num,"tip":"insight"}
Use real names. Include local modes (auto/tram/ferry if applicable).`;

  const { res, model } = await callWithFallback(
    apiKey,
    (modelId) => ({ model: modelId, max_tokens: 1800, messages:[{role:"user",content:prompt}] }),
    onModelChange
  );

  const data = await res.json();
  const tokensUsed = (data.usage?.input_tokens||180) + (data.usage?.output_tokens||700);
  TOKEN_SESSION.used += tokensUsed;

  let raw = data.content.map(b=>b.text||"").join("").trim();
  raw = raw.replace(/```json\s*/gi,"").replace(/```\s*/gi,"").trim();
  const arrStart = raw.indexOf("[");
  const arrEnd   = raw.lastIndexOf("]");
  if (arrStart === -1) throw new Error("No JSON array found in response");
  let jsonStr = arrEnd > arrStart ? raw.slice(arrStart, arrEnd+1) : raw.slice(arrStart);
  if (!jsonStr.endsWith("]")) {
    const lastComma = jsonStr.lastIndexOf(",{");
    if (lastComma > 0) jsonStr = jsonStr.slice(0, lastComma);
    jsonStr = jsonStr.trimEnd().replace(/,\s*$/, "") + "]";
  }
  const routes = JSON.parse(jsonStr);
  if (!Array.isArray(routes) || routes.length === 0) throw new Error("Empty routes returned");

  _saveCache(key, routes, tokensUsed);
  onTokenUpdate && onTokenUpdate({ ...TOKEN_SESSION });
  return { routes, fromCache: false, tokensUsed, model };
}

async function generateCityConfig(cityName,country,apiKey){

  const prompt=`You are a transit data expert. Generate a complete city transit configuration for "${cityName}", ${country}.

The object must have exactly these fields:

    {"stn":"station name","pct":58,"dir":"short description"},
    {"stn":"station name","pct":64,"dir":"short description"}
  ],
  "alerts": [
    {"type":"warn","msg":"realistic delay or issue alert for ${cityName}"},
    {"type":"info","msg":"useful transit tip specific to ${cityName}"},
    {"type":"safe","msg":"safety or accessibility feature in ${cityName}"},
    {"type":"crowd","msg":"crowd management tip for a busy station in ${cityName}"}
  ],
  "budget": [number,number,number,number,number,number,0],
  "monthlyBudget": number
}

Rules:
- Use REAL station names, line names, and landmarks for ${cityName}
- Currency and fares must be realistic for ${cityName}, ${country}
- budget array = 7 daily spend values (Mon-Sun), last value 0 for Sunday
- monthlyBudget = realistic monthly commute budget in local currency
- Lines should be real transit lines that exist in ${cityName}
- Popular routes must be real neighbourhoods/stations in ${cityName}`;

  const {res} = await callWithFallback(
    apiKey,
    (modelId)=>({model:modelId, max_tokens:2000, messages:[{role:"user",content:prompt}]}),
    null
  );
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(res.status===401?"AUTH_FAILED":e.error?.message||`HTTP ${res.status}`);}
  const data=await res.json();
  const cityTokens=(data.usage?.input_tokens||320)+(data.usage?.output_tokens||900);

  TOKEN_SESSION.used+=cityTokens;
  let cityRaw=data.content.map(b=>b.text||"").join("").trim().replace(/```json\s*/gi,"").replace(/```\s*/gi,"").trim();
  const objStart=cityRaw.indexOf("{"); const objEnd=cityRaw.lastIndexOf("}");
  if(objStart===-1) throw new Error("No JSON object in city config response");
  const cityJson = objEnd>objStart ? cityRaw.slice(objStart,objEnd+1) : cityRaw.slice(objStart)+"}";
  const parsed=JSON.parse(cityJson);

  // Build full city object
  const key=slugify(cityName);
  return {
    key,
    name:cityName,

    popularRoutes:parsed.popularRoutes||[[cityName,"City Centre"]],
    lines:parsed.lines||[],
    stations:parsed.stations||[],
    alerts:parsed.alerts||[],
    budget:parsed.budget||[0,0,0,0,0,0,0],
    monthlyBudget:parsed.monthlyBudget||200,

        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,letterSpacing:"0.1em",
          background:`linear-gradient(135deg,${acc},${accB})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
          ADD NEW CITY
        </div>
        <div style={{fontSize:10,color:C.muted,marginTop:2}}>AI generates full transit config instantly</div>
      </div>

      {/* ── SELECT STEP ── */}
      {step==="select" && (
        <div style={{animation:"fadeIn .3s ease"}}>
          {/* Country dropdown */}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",marginBottom:7}}>🌍 SELECT COUNTRY</div>
            <div style={{position:"relative"}}>
              <select value={selCountry} onChange={e=>{setSelCountry(e.target.value);setSelCity("");}}
                style={selStyle(acc)}>
                <option value="">— Choose a country —</option>
                {countries.map(c=>(
                  <option key={c} value={c}>{COUNTRY_FLAGS[c]||"🌍"} {c}</option>
                ))}
              </select>
            </div>
          </div>

          {/* City dropdown */}
          {selCountry && (
            <div style={{marginBottom:14,animation:"fadeIn .25s ease"}}>
              <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",marginBottom:7}}>🏙️ SELECT CITY</div>
              <div style={{position:"relative"}}>
                <select value={selCity} onChange={e=>setSelCity(e.target.value)}
                  style={selStyle(acc)}>
                  <option value="">— Choose a city —</option>
                  {citiesForCountry.map(c=>{
                    const disabled=existingKeys.includes(slugify(c));
                    return(
                      <option key={c} value={c} disabled={disabled}>
                        {c}{disabled?" (already added)":""}
                      </option>
                    );
                  })}
                  <option value="__custom__">✏️ Enter a different city…</option>
                </select>
              </div>
            </div>
          )}

          {/* Custom city input */}
          {selCity==="__custom__" && (
            <div style={{marginBottom:14,animation:"fadeIn .25s ease"}}>
              <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",marginBottom:7}}>✏️ CITY NAME</div>
              <input value={customCity} onChange={e=>setCustomCity(e.target.value)}
                placeholder={`e.g. Bengaluru, Osaka, Lyon…`}
                onKeyDown={e=>{if(e.key==="Enter"&&finalCityName)generate();}}
                style={inp}/>
            </div>
          )}

          {/* Preview card of selection */}
          {selCountry && finalCityName && (
            <div style={{background:`linear-gradient(135deg,${COUNTRY_ACCENTS[selCountry]||acc}18,transparent)`,
              border:`1px solid ${COUNTRY_ACCENTS[selCountry]||acc}44`,
              borderRadius:12,padding:"12px 14px",marginBottom:14,animation:"fadeIn .25s ease"}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:28}}>{COUNTRY_FLAGS[selCountry]||"🌍"}</span>
                <div>
                  <div style={{fontWeight:700,fontSize:15}}>{finalCityName}</div>
                  <div style={{fontSize:11,color:C.muted}}>{selCountry}</div>
                </div>
                {alreadyAdded && (
                  <span style={{marginLeft:"auto",fontSize:10,background:"rgba(0,212,170,0.15)",
                    color:C.emerald,borderRadius:6,padding:"3px 8px"}}>✓ Already added</span>
                )}
              </div>
            </div>
          )}

          {/* What AI will generate */}
          {finalCityName && !alreadyAdded && (
            <div style={{background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,
              borderRadius:11,padding:"11px 13px",marginBottom:14,fontSize:11,color:C.textDim,lineHeight:1.7}}>
              🤖 AI will generate: transit lines · station crowd data · popular routes · live alerts · fare estimates · weekly budget
            </div>
          )}

          {/* Buttons */}
          <div style={{display:"flex",gap:8}}>
            <button onClick={onClose} style={{flex:"0 0 auto",background:"transparent",
              border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",
              cursor:"pointer",color:C.muted,fontSize:12}}>Cancel</button>
            <button onClick={generate}
              disabled={!finalCityName||!selCountry||alreadyAdded}
              style={{flex:1,
                background:(!finalCityName||!selCountry||alreadyAdded)?"rgba(255,255,255,0.05)":`linear-gradient(135deg,${acc},${accB})`,
                border:"none",borderRadius:10,padding:"11px",
                cursor:(!finalCityName||!selCountry||alreadyAdded)?"not-allowed":"pointer",
                fontWeight:700,fontSize:13,
                color:(!finalCityName||!selCountry||alreadyAdded)?C.muted:"#000",
                boxShadow:(!finalCityName||!selCountry||alreadyAdded)?"none":`0 3px 14px ${acc}44`,
                transition:"all 0.2s"}}>
              {alreadyAdded?"Already in your cities":"✦ Generate with AI"}
            </button>
          </div>
        </div>
      )}

      {/* ── GENERATING STEP ── */}
      {step==="generating" && (
        <div style={{textAlign:"center",padding:"20px 0",animation:"fadeIn .3s ease"}}>
          <div style={{fontSize:44,marginBottom:16}}>
            <span className="spin" style={{display:"inline-block"}}>⚙️</span>
          </div>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:18,letterSpacing:"0.1em",
            color:acc,marginBottom:8}}>GENERATING CITY</div>
          <div style={{fontWeight:600,fontSize:14,marginBottom:6}}>{finalCityName}, {selCountry}</div>
          <div style={{fontSize:12,color:C.muted,marginBottom:20}}>{progress}</div>
          {/* Animated progress bar */}
          <div style={{height:4,background:"rgba(255,255,255,0.06)",borderRadius:4,overflow:"hidden",margin:"0 20px"}}>
            <div style={{height:"100%",background:`linear-gradient(90deg,${acc},${accB})`,
              borderRadius:4,animation:"progressBar 6s linear forwards",width:"0%"}}/>
          </div>
          <div style={{fontSize:10,color:C.muted,marginTop:10}}>This takes about 5–8 seconds</div>
          <style>{`@keyframes progressBar{from{width:0%}to{width:95%}}`}</style>
        </div>
      )}

      {/* ── PREVIEW STEP ── */}
      {step==="preview" && preview && (
        <div style={{animation:"fadeIn .3s ease"}}>
          {/* Success badge */}
          <div style={{background:"rgba(0,212,170,0.1)",border:"1px solid rgba(0,212,170,0.25)",
            borderRadius:11,padding:"10px 14px",marginBottom:14,
            display:"flex",alignItems:"center",gap:9}}>
            <span style={{fontSize:18}}>✅</span>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:C.emerald}}>City config generated!</div>
              <div style={{fontSize:10,color:C.muted}}>Review below and confirm to add</div>
            </div>
          </div>

          {/* City header */}
          <div style={{background:`linear-gradient(135deg,${preview.accent}1A,${preview.accentB}0E)`,
            border:`1px solid ${preview.accent}44`,borderRadius:13,padding:"14px",marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <span style={{fontSize:28}}>{preview.flag}</span>
              <div>
                <div style={{fontWeight:700,fontSize:16}}>{preview.name}</div>
                <div style={{fontSize:11,color:C.muted}}>{preview.country} · {preview.code} · {preview.timezone}</div>
              </div>
            </div>
            <div style={{fontSize:11,color:C.textDim,marginBottom:4}}>🚉 {preview.transitLabel}</div>
            <div style={{fontSize:11,color:C.textDim}}>
              Default route: <span style={{color:C.text,fontWeight:500}}>{preview.defaultFrom}</span>
              {" → "}<span style={{color:C.text,fontWeight:500}}>{preview.defaultTo}</span>
            </div>
          </div>

          {/* Lines preview */}
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:11,padding:"12px 13px",marginBottom:10}}>
            <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",marginBottom:9}}>🚇 TRANSIT LINES</div>
            {(preview.lines||[]).slice(0,3).map((l,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                paddingBottom:i<2?"8px 0":"0",marginBottom:i<2?8:0,
                borderBottom:i<(preview.lines.length-1)&&i<2?`1px solid rgba(255,255,255,0.05)`:"none"}}>
                <div>
                  <div style={{fontSize:12,fontWeight:600}}>{l.line}</div>
                  <div style={{fontSize:10,color:C.muted}}>{l.route}</div>
                </div>
                <div style={{fontSize:10,color:statusClr(l.status),fontWeight:600}}>{l.status}</div>
              </div>
            ))}
          </div>

          {/* Popular routes */}
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:11,padding:"12px 13px",marginBottom:10}}>
            <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",marginBottom:9}}>⚡ POPULAR ROUTES</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {(preview.popularRoutes||[]).map((p,i)=>(
                <div key={i} style={{fontSize:10,background:"rgba(255,255,255,0.05)",
                  border:`1px solid ${C.border}`,borderRadius:7,padding:"4px 9px",color:C.textDim}}>
                  {p[0]} → {p[1]}
                </div>
              ))}
            </div>
          </div>

          {/* Budget */}
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:11,
            padding:"11px 13px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontSize:11,color:C.muted}}>Monthly commute budget</div>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:14,fontWeight:600,color:preview.accentB}}>
              {preview.currency}{preview.monthlyBudget.toLocaleString()}
            </div>
          </div>

          {/* Confirm buttons */}
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setStep("select")} style={{flex:"0 0 auto",background:"transparent",
              border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",
              cursor:"pointer",color:C.muted,fontSize:12}}>← Redo</button>
            <button onClick={confirm} style={{
              flex:1,background:`linear-gradient(135deg,${preview.accent},${preview.accentB})`,
              border:"none",borderRadius:10,padding:"11px",
              cursor:"pointer",fontWeight:700,fontSize:13,color:"#000",
              boxShadow:`0 3px 14px ${preview.accent}44`}}>
              ✓ Add {preview.name} to Tranzit
            </button>
          </div>
        </div>
      )}

      {/* ── ERROR STEP ── */}
      {step==="error" && (
        <div style={{animation:"fadeIn .3s ease"}}>
          <div style={{background:"rgba(255,68,102,0.1)",border:"1px solid rgba(255,68,102,0.3)",
            borderRadius:12,padding:"16px",marginBottom:16,textAlign:"center"}}>
            <div style={{fontSize:32,marginBottom:8}}>⚠️</div>
            <div style={{fontWeight:600,color:C.crimson,marginBottom:6,fontSize:13}}>Generation Failed</div>
            <div style={{fontSize:11,color:C.textDim,lineHeight:1.6}}>{errMsg}</div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={onClose} style={{flex:1,background:"transparent",
              border:`1px solid ${C.border}`,borderRadius:10,padding:"10px",
              cursor:"pointer",color:C.muted,fontSize:12}}>Cancel</button>
            <button onClick={()=>{setStep("select");setErrMsg("");}} style={{
              flex:1,background:`linear-gradient(135deg,${acc},${accB})`,
              border:"none",borderRadius:10,padding:"10px",cursor:"pointer",
              fontWeight:700,fontSize:13,color:"#000"}}>Try Again</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── RIDE HUB MODAL ────────────────────────────────────────────────────────────
// ── NAVIGATE TO STATION TAB ────────────────────────────────────────────────────
function NavigateTab({city, acc, accB}) {
  const stations = STATION_COORDS[city.code] || [];
  const [step,    setStep]    = useState("idle"); // idle | locating | results | error
  const [navLoc,  setNavLoc]  = useState(null);
  const [nearest, setNearest] = useState([]);
  const [selected,setSelected]= useState(null);
  const [transit, setTransit] = useState("metro"); // metro | bus | all

  // Straight-line distance → realistic time estimates
  const walkMin = km => Math.max(2, Math.round(km / 5 * 60));
  const cabMin  = km => Math.max(2, Math.round(km / 20 * 60));

  const detect = async () => {
    setStep("locating"); setNearest([]); setSelected(null); setNavLoc(null);
    try {
      const pos = await new Promise((res,rej) => {
        if(!navigator.geolocation){ rej(new Error("no_geo")); return; }
        navigator.geolocation.getCurrentPosition(
          p => res({lat: p.coords.latitude, lng: p.coords.longitude}),
          e => rej(e),
          {timeout:8000, enableHighAccuracy:true, maximumAge:15000}
        );
      });
      setNavLoc(pos);
      // Sort all stations by true distance, take top 5
      const sorted = stations
        .map(s => ({...s, km: parseFloat(haversineKm(pos.lat, pos.lng, s.lat, s.lng).toFixed(2))}))
        .sort((a,b) => a.km - b.km)
        .slice(0, 5);
      setNearest(sorted);
      setStep("results");
    } catch(e) {
      setStep("error");
    }
  };

  const navigate = (station, mode) => {
    const dest = encodeURIComponent(station.n + ", " + city.name);
    const travel = mode === "walk" ? "walking" : "driving";
    if(navLoc) {
      window.open(
        "https://www.google.com/maps/dir/" + navLoc.lat + "," + navLoc.lng +
        "/" + dest + "/?travelmode=" + travel, "_blank"
      );
    } else {
      window.open("https://www.google.com/maps/dir/My+Location/" + dest + "/?travelmode=" + travel, "_blank");
    }
  };

  const searchOnMaps = (type) => {
    if(navLoc) {
      const q = type === "bus" ? "bus+stand+near+me" : "metro+station+near+me";
      window.open("https://www.google.com/maps/search/" + q + "/@" + navLoc.lat + "," + navLoc.lng + ",15z", "_blank");
    } else {
      window.open("https://www.google.com/maps/search/transit+station+near+me/", "_blank");
    }
  };

  // ── IDLE STATE ──────────────────────────────────────────────────────────────
  if(step === "idle") return (
    <div>
      <div style={{textAlign:"center",padding:"24px 16px 20px"}}>
        <div style={{fontSize:48,marginBottom:12}}>🧭</div>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,letterSpacing:"0.08em",
          background:"linear-gradient(135deg,"+acc+","+accB+")",
          WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:8}}>
          FIND NEAREST TRANSIT
        </div>
        <div style={{fontSize:13,color:C.textDim,lineHeight:1.7,maxWidth:280,margin:"0 auto"}}>
          Tap below to find the nearest metro stations and transit points to your current location
        </div>
      </div>

      <button onClick={detect} style={{
        width:"100%",
        background:"linear-gradient(135deg,"+acc+","+accB+")",
        border:"none",borderRadius:16,padding:"18px",cursor:"pointer",
        fontWeight:700,fontSize:16,color:"#000",marginBottom:20,
        display:"flex",alignItems:"center",justifyContent:"center",gap:10,
        boxShadow:"0 6px 24px "+acc+"55"}}>
        <span style={{fontSize:24}}>📍</span>
        Detect My Location
      </button>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <button onClick={()=>searchOnMaps("metro")} style={{
          background:"rgba(255,255,255,0.04)",border:"1px solid "+C.border,
          borderRadius:12,padding:"14px 10px",cursor:"pointer",textAlign:"center"}}>
          <div style={{fontSize:24,marginBottom:6}}>🚇</div>
          <div style={{fontSize:12,fontWeight:600,color:C.text,marginBottom:2}}>Metro Stations</div>
          <div style={{fontSize:10,color:C.muted}}>Open in Google Maps</div>
        </button>
        <button onClick={()=>searchOnMaps("bus")} style={{
          background:"rgba(255,255,255,0.04)",border:"1px solid "+C.border,
          borderRadius:12,padding:"14px 10px",cursor:"pointer",textAlign:"center"}}>
          <div style={{fontSize:24,marginBottom:6}}>🚌</div>
          <div style={{fontSize:12,fontWeight:600,color:C.text,marginBottom:2}}>Bus Stands</div>
          <div style={{fontSize:10,color:C.muted}}>Open in Google Maps</div>
        </button>
      </div>
      <div style={{fontSize:10,color:C.muted,textAlign:"center",lineHeight:1.6}}>
        These open Google Maps with all nearby transit points shown on the map
      </div>
    </div>
  );

  // ── LOCATING STATE ──────────────────────────────────────────────────────────
  if(step === "locating") return (
    <div style={{textAlign:"center",padding:"60px 20px"}}>
      <div style={{fontSize:42,animation:"pulse 1s ease-in-out infinite",marginBottom:16}}>📍</div>
      <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:18,letterSpacing:"0.1em",
        color:acc,marginBottom:8}}>FINDING YOUR LOCATION</div>
      <div style={{fontSize:12,color:C.muted}}>Getting GPS and finding nearest stations…</div>
    </div>
  );

  // ── ERROR STATE ─────────────────────────────────────────────────────────────
  if(step === "error") return (
    <div>
      <div style={{background:"rgba(245,166,35,0.10)",border:"1px solid rgba(245,166,35,0.35)",
        borderRadius:14,padding:"20px 16px",marginBottom:16,textAlign:"center"}}>
        <div style={{fontSize:36,marginBottom:10}}>📵</div>
        <div style={{fontSize:14,fontWeight:700,color:"#F5A623",marginBottom:8}}>Location Access Blocked</div>
        <div style={{fontSize:11,color:C.textDim,lineHeight:1.8,marginBottom:4}}>
          <strong style={{color:C.text}}>iPhone / Safari:</strong><br/>
          Settings → Privacy & Security →<br/>Location Services → Safari →<br/>
          <strong style={{color:"#F5A623"}}>While Using App</strong>
        </div>
        <div style={{fontSize:11,color:C.textDim,lineHeight:1.8,marginBottom:16}}>
          <strong style={{color:C.text}}>Chrome:</strong> tap 🔒 in address bar →<br/>
          Site Settings → Location → Allow
        </div>
        <button onClick={detect} style={{
          background:"linear-gradient(135deg,"+acc+","+accB+")",
          border:"none",borderRadius:10,padding:"11px 24px",cursor:"pointer",
          fontWeight:700,fontSize:13,color:"#000",marginBottom:10}}>
          ↻ Try Again
        </button>
      </div>

      <div style={{fontSize:11,fontWeight:600,color:C.muted,textAlign:"center",
        marginBottom:12,letterSpacing:"0.08em"}}>OR USE GOOGLE MAPS DIRECTLY</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <button onClick={()=>searchOnMaps("metro")} style={{
          background:"linear-gradient(135deg,#1A73E8,#4285F4)",border:"none",
          borderRadius:12,padding:"14px 10px",cursor:"pointer",textAlign:"center"}}>
          <div style={{fontSize:22,marginBottom:5}}>🚇</div>
          <div style={{fontSize:11,fontWeight:700,color:"#fff"}}>Nearest Metro</div>
        </button>
        <button onClick={()=>searchOnMaps("bus")} style={{
          background:"linear-gradient(135deg,#1A73E8,#4285F4)",border:"none",
          borderRadius:12,padding:"14px 10px",cursor:"pointer",textAlign:"center"}}>
          <div style={{fontSize:22,marginBottom:5}}>🚌</div>
          <div style={{fontSize:11,fontWeight:700,color:"#fff"}}>Nearest Bus</div>
        </button>
      </div>
    </div>
  );

  // ── RESULTS STATE ───────────────────────────────────────────────────────────
  return (
    <div>
      {/* Location confirmed */}
      <div style={{display:"flex",alignItems:"center",gap:10,
        background:"rgba(0,212,170,0.08)",border:"1px solid rgba(0,212,170,0.25)",
        borderRadius:11,padding:"10px 13px",marginBottom:14}}>
        <span style={{fontSize:18}}>📍</span>
        <div style={{flex:1}}>
          <div style={{fontSize:10,color:C.emerald,fontWeight:600,letterSpacing:"0.06em"}}>LOCATION FOUND</div>
          <div style={{fontSize:10,color:C.muted,marginTop:1}}>
            {navLoc.lat.toFixed(5)}, {navLoc.lng.toFixed(5)}
          </div>
        </div>
        <button onClick={()=>{setStep("idle");setNearest([]);setSelected(null);}} style={{
          background:"rgba(255,255,255,0.06)",border:"1px solid "+C.border,
          borderRadius:7,padding:"4px 9px",cursor:"pointer",fontSize:10,color:C.muted}}>
          Reset
        </button>
      </div>

      {/* Nearest stations */}
      {nearest.length > 0 && (
        <div>
          <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",marginBottom:10}}>
            🚇 {nearest.length} NEAREST METRO STATIONS IN {city.name.toUpperCase()}
          </div>

          {nearest.map(function(s, i) {
            var isSelected = selected && selected.n === s.n;
            var isFirst = i === 0;
            return (
              <div key={i}
                onClick={()=>setSelected(isSelected ? null : s)}
                style={{
                  background: isSelected
                    ? "linear-gradient(135deg,"+acc+"18,"+accB+"0E)"
                    : isFirst ? "rgba(255,255,255,0.04)" : C.surface,
                  border: "1px solid "+(isSelected ? acc+"55" : isFirst ? acc+"22" : C.border),
                  borderRadius:14,padding:"14px",marginBottom:10,
                  cursor:"pointer",transition:"all 0.2s"}}>

                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  {/* Rank */}
                  <div style={{width:36,height:36,borderRadius:10,flexShrink:0,
                    background: isFirst
                      ? "linear-gradient(135deg,"+acc+","+accB+")"
                      : "rgba(255,255,255,0.08)",
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontWeight:700,fontSize:15,
                    color: isFirst ? "#000" : C.muted}}>
                    {isFirst ? "★" : i+1}
                  </div>

                  {/* Info */}
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:14,color:C.text}}>{s.n}</div>
                    <div style={{fontSize:10,color:C.muted,marginTop:2}}>{s.line}</div>
                  </div>

                  {/* Distance */}
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontFamily:"'DM Mono',monospace",fontWeight:700,
                      fontSize:18,color:isFirst ? acc : C.text}}>{s.km}</div>
                    <div style={{fontSize:9,color:C.muted}}>km away</div>
                  </div>
                </div>

                {/* Time estimates */}
                <div style={{display:"flex",gap:8,marginTop:10}}>
                  <div style={{flex:1,background:"rgba(0,212,170,0.08)",
                    border:"1px solid rgba(0,212,170,0.2)",
                    borderRadius:9,padding:"7px",textAlign:"center"}}>
                    <div style={{fontSize:8,color:C.muted,letterSpacing:"0.08em",marginBottom:2}}>🚶 WALK</div>
                    <div style={{fontFamily:"'DM Mono',monospace",fontWeight:700,
                      fontSize:16,color:C.emerald}}>~{walkMin(s.km)}<span style={{fontSize:10,fontWeight:400}}> min</span></div>
                  </div>
                  <div style={{flex:1,background:"rgba(79,195,247,0.08)",
                    border:"1px solid rgba(79,195,247,0.2)",
                    borderRadius:9,padding:"7px",textAlign:"center"}}>
                    <div style={{fontSize:8,color:C.muted,letterSpacing:"0.08em",marginBottom:2}}>🚗 CAB</div>
                    <div style={{fontFamily:"'DM Mono',monospace",fontWeight:700,
                      fontSize:16,color:C.sky}}>~{cabMin(s.km)}<span style={{fontSize:10,fontWeight:400}}> min</span></div>
                  </div>
                </div>

                {/* Navigation buttons — shown when selected */}
                {isSelected && (
                  <div style={{marginTop:12,display:"flex",gap:8,animation:"fadeIn 0.2s ease"}}>
                    <button onClick={function(e){e.stopPropagation();navigate(s,"walk");}} style={{
                      flex:1,background:"rgba(0,212,170,0.12)",
                      border:"1px solid rgba(0,212,170,0.35)",
                      borderRadius:10,padding:"11px 8px",cursor:"pointer",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:6,
                      fontWeight:700,fontSize:13,color:C.emerald}}>
                      🚶 Walk Route
                    </button>
                    <button onClick={function(e){e.stopPropagation();navigate(s,"cab");}} style={{
                      flex:1,background:"linear-gradient(135deg,#1A73E8,#4285F4)",

                      display:"flex",alignItems:"center",justifyContent:"center",gap:6,

          🚌 Find Nearest Bus Stand

          width:"100%",background:"linear-gradient(135deg,#1A73E8,#4285F4)",
          border:"none",borderRadius:10,padding:"11px",cursor:"pointer",
          fontWeight:700,fontSize:13,color:"#fff",
          display:"flex",alignItems:"center",justifyContent:"center",gap:8,
          boxShadow:"0 3px 12px rgba(26,115,232,0.35)"}}>
          🗺️ Show Nearest Bus Stands on Google Maps
        </button>
      </div>
    </div>
  );
}


function RideHubModal({city, dest, onClose}) {
  const apps = RIDE_APPS[city.country] || RIDE_APPS["_default"];
  const acc  = city.accent, accB = city.accentB;
  const [launched, setLaunched] = useState(null);
  const [tab, setTab] = useState("all"); // all | cab | bike | auto

  const modes = [...new Set(apps.map(a=>a.mode.split("/")[0]))];
  const filtered = tab==="all" ? apps : apps.filter(a=>a.mode.toLowerCase().includes(tab));

  const handleLaunch = (app) => {
    setLaunched(app.name);
    launchRideApp(app, dest);
    setTimeout(()=>setLaunched(null), 2000);
  };

  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",
      zIndex:150,display:"flex",alignItems:"flex-end",backdropFilter:"blur(6px)"}}>
      <div onClick={e=>e.stopPropagation()} className="modal-sheet" style={{
        width:"100%",background:"#0E0E18",borderRadius:"22px 22px 0 0",
        border:`1px solid ${acc}33`,padding:"20px 16px 36px",maxHeight:"88vh",overflowY:"auto"}}>

        {/* Handle */}
        <div style={{textAlign:"center",marginBottom:16}}>
          <div style={{width:36,height:4,background:C.muted,borderRadius:2,margin:"0 auto 14px"}}/>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:4}}>
            <div style={{width:36,height:36,borderRadius:10,
              background:`linear-gradient(135deg,${acc},${accB})`,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>🚕</div>
            <div style={{textAlign:"left"}}>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:"0.08em",
                background:`linear-gradient(135deg,${acc},${accB})`,
                WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>RIDE BOOKING HUB</div>
              <div style={{fontSize:10,color:C.muted}}>{city.name} · {apps.length} apps available</div>
            </div>
          </div>
          {dest&&<div style={{fontSize:11,color:C.textDim,marginTop:6}}>
            📍 Destination: <span style={{color:C.text,fontWeight:600}}>{dest}</span>
          </div>}
        </div>

        {/* Mode filter tabs */}
        <div style={{display:"flex",gap:6,marginBottom:16,overflowX:"auto"}}>
          {["all",...modes.slice(0,4)].map(m=>(
            <button key={m} onClick={()=>setTab(m)} style={{
              flexShrink:0,background:tab===m?`linear-gradient(135deg,${acc},${accB})`:C.surface,
              color:tab===m?"#000":C.textDim,
              border:tab===m?"none":`1px solid ${C.border}`,
              borderRadius:8,padding:"6px 12px",cursor:"pointer",
              fontSize:11,fontWeight:tab===m?700:400,textTransform:"capitalize"}}>
              {m==="all"?"All Apps":m}
            </button>
          ))}
        </div>

        {/* App cards */}
        <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:16}}>
          {filtered.map((app,i)=>(
            <div key={i} style={{
              background:C.surface,border:`1px solid ${C.border}`,
              borderRadius:14,padding:"13px 14px",
              display:"flex",alignItems:"center",gap:12,
              transition:"all 0.2s"}}>

              {/* App icon */}
              <div style={{width:46,height:46,borderRadius:12,flexShrink:0,
                background:app.bg,display:"flex",alignItems:"center",
                justifyContent:"center",fontSize:20,
                boxShadow:`0 4px 12px ${app.bg}55`}}>
                {app.icon}
              </div>

              {/* Info */}
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:14,color:C.text}}>{app.name}</div>
                <div style={{display:"flex",gap:6,marginTop:3,flexWrap:"wrap"}}>
                  <span style={{fontSize:9,background:`${acc}18`,color:acc,
                    borderRadius:5,padding:"2px 7px",fontWeight:600}}>{app.mode}</span>
                  <span style={{fontSize:9,color:C.muted}}>{app.tag}</span>
                </div>
              </div>

              {/* Open button */}
              <button onClick={()=>handleLaunch(app)} style={{
                flexShrink:0,
                background:launched===app.name
                  ?`linear-gradient(135deg,${C.emerald},#00AA88)`
                  :`linear-gradient(135deg,${app.bg},${app.bg}CC)`,
                border:"none",borderRadius:10,
                padding:"9px 14px",cursor:"pointer",
                fontWeight:700,fontSize:12,color:app.fg,
                boxShadow:`0 3px 10px ${app.bg}55`,
                transition:"all 0.25s",minWidth:72,textAlign:"center"}}>
                {launched===app.name?"✓ Opening":"Open →"}
              </button>
            </div>
          ))}
        </div>

        {/* Tip */}
        <div style={{background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,
          borderRadius:10,padding:"10px 13px",marginBottom:8}}>
          <div style={{fontSize:10,color:C.muted,lineHeight:1.7}}>
            💡 <strong style={{color:C.text}}>How it works:</strong> Tap Open → to launch the app directly. If not installed, we'll take you to the App Store or Play Store to download it. Your destination is pre-filled where supported.
          </div>
        </div>

        <button onClick={onClose} style={{
          width:"100%",background:"rgba(255,255,255,0.06)",
          border:`1px solid ${C.border}`,borderRadius:12,padding:"12px",
          cursor:"pointer",color:C.muted,fontSize:13,fontWeight:600}}>
          Close
        </button>
      </div>
    </div>
  );
}

function ApiKeyPanel({acc,accB,onSaved,onCancel,showCancel}){
  const [val,setVal]=useState(""),  [show,setShow]=useState(false);
  const [err,setErr]=useState(""),  [busy,setBusy]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{setTimeout(()=>ref.current?.focus(),80);},[]);
  const save=async()=>{
    const k=val.trim();
    if(!k){setErr("Please paste your API key.");return;}
    if(!k.startsWith("sk-ant-")){setErr("Key should start with sk-ant-…");return;}
    setBusy(true);setErr("");
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:ACTIVE_MODEL.id,max_tokens:10,messages:[{role:"user",content:"hi"}]})});
      if(r.status===401){setBusy(false);setErr("Invalid key — authentication failed.");return;}
    }catch(e){}
    localStorage.setItem(API_KEY_STORAGE,k);setBusy(false);onSaved(k);
  };
  const inp={width:"100%",background:"rgba(0,0,0,0.3)",border:`1.5px solid ${err?"#FF4466":val.startsWith("sk-ant-")&&val.length>20?acc:C.border}`,borderRadius:10,padding:"10px 44px 10px 12px",color:C.text,fontSize:13,outline:"none",transition:"border 0.2s",boxSizing:"border-box"};
  return(
    <div className="glow" style={{background:`linear-gradient(135deg,${acc}12,${accB}08)`,border:`1px solid ${acc}44`,borderRadius:16,padding:"18px 16px",animation:"fadeIn 0.3s ease"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <div style={{width:40,height:40,borderRadius:12,background:`linear-gradient(135deg,${acc},${accB})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>🔑</div>
        <div>
          <div style={{fontWeight:700,fontSize:14,color:C.text}}>Connect Anthropic AI</div>
          <div style={{fontSize:10,color:C.muted,marginTop:1}}>One-time setup · Saved to your browser</div>
        </div>
      </div>
      <div style={{marginBottom:14}}>
        {[{n:"1",t:"Go to",link:"console.anthropic.com",url:"https://console.anthropic.com/settings/keys"},{n:"2",t:"Create a new API key"},{n:"3",t:"Paste it below"}].map((s,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:7}}>
            <div style={{width:20,height:20,borderRadius:"50%",background:`${acc}33`,border:`1px solid ${acc}55`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:acc,flexShrink:0}}>{s.n}</div>
            <div style={{fontSize:11,color:C.textDim}}>{s.t}{" "}{s.link&&<a href={s.url} target="_blank" rel="noreferrer" style={{color:acc,textDecoration:"none",fontWeight:600}}>{s.link} ↗</a>}</div>
          </div>
        ))}
      </div>
      <div style={{position:"relative",marginBottom:err?8:12}}>
        <input ref={ref} type={show?"text":"password"} placeholder="sk-ant-api03-…" value={val} onChange={e=>{setVal(e.target.value);setErr("");}} onKeyDown={e=>{if(e.key==="Enter")save();}} style={inp}/>
        <button onClick={()=>setShow(s=>!s)} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"transparent",border:"none",cursor:"pointer",color:C.muted,fontSize:16,padding:4}}>{show?"🙈":"👁️"}</button>
      </div>
      {err&&<div style={{fontSize:11,color:C.crimson,marginBottom:10,display:"flex",alignItems:"center",gap:5}}>⚠️ {err}</div>}
      <div style={{display:"flex",gap:8}}>
        {showCancel&&<button onClick={onCancel} style={{flex:"0 0 auto",background:"transparent",border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",cursor:"pointer",color:C.muted,fontSize:12}}>Cancel</button>}
        <button onClick={save} disabled={busy||!val.trim()} style={{flex:1,background:busy||!val.trim()?"rgba(255,255,255,0.05)":`linear-gradient(135deg,${acc},${accB})`,border:"none",borderRadius:10,padding:"11px",cursor:busy||!val.trim()?"not-allowed":"pointer",fontWeight:700,fontSize:13,color:busy||!val.trim()?C.muted:"#000",transition:"all 0.2s",boxShadow:busy||!val.trim()?"none":`0 3px 14px ${acc}44`}}>{busy?"⏳ Verifying…":"✓  Save & Activate"}</button>
      </div>
      <div style={{marginTop:10,fontSize:10,color:C.muted,textAlign:"center",lineHeight:1.5}}>🔒 Key stored in your browser only · Never sent anywhere except Anthropic</div>
    </div>
  );
}

function TranzitApp(){
  // Load custom cities from localStorage
  const loadCustom=()=>{try{return JSON.parse(localStorage.getItem(CUSTOM_CITY_STORAGE)||"{}");}catch{return{};}};

  const [customCities,setCustomCities]=useState(loadCustom);
  const allCities = {...BUILTIN_CITIES,...customCities};

  // Build dynamic country groups from all cities
  const buildGroups=()=>{
    const map={};
    Object.entries(allCities).forEach(([k,c])=>{
      if(!map[c.country]) map[c.country]={country:c.country,flag:c.flag,cities:[]};
      map[c.country].cities.push(k);
    });
    return Object.values(map);
  };

  const [cityKey,   setCityKey]   = useState("hyderabad");
  const [activeTab, setActiveTab] = useState("plan");
  const [selRoute,  setSelRoute]  = useState(0);
  const [sosActive, setSosActive] = useState(false);

  const [sosCountdown, setSosCountdown] = useState(5);

  // SOS settings (persisted in localStorage)

  const [sosSettings, setSosSettings] = useState(loadSosSettings);
  const [sosSetupOpen, setSosSetupOpen] = useState(false);

  const saveSosSettings = (s) => { setSosSettings(s); localStorage.setItem(SOS_STORAGE, JSON.stringify(s)); };

  useEffect(() => () => clearInterval(sosTimerRef.current), []);
  const [cityModal, setCityModal] = useState(false);
  const [addCityOpen,setAddCityOpen]=useState(false);
  const [time,      setTime]      = useState(new Date());
  const [rideHubOpen, setRideHubOpen] = useState(false);
  const [rideHubDest, setRideHubDest] = useState("");

  // ── Offline mode state ──
  const [isOffline,      setIsOffline]      = useState(!navigator.onLine);
  const [offlineSnap,    setOfflineSnap]    = useState(loadOfflineSnapshot);
  const [showOfflineBanner, setShowOfflineBanner] = useState(false);

  // ── Journey Planner state ──
  const [plannerOpen,    setPlannerOpen]    = useState(false);
  const [plannerDest,    setPlannerDest]    = useState("");
  const [plannerOrigin,  setPlannerOrigin]  = useState("");
  const [plannerArrival, setPlannerArrival] = useState("");
  const [plannerResult,  setPlannerResult]  = useState(null);
  const [plannerLoading, setPlannerLoading] = useState(false);
  const [plannerLocation,setPlannerLocation]= useState(null); // {lat,lng}
  const [plannerLocBusy, setPlannerLocBusy]= useState(false);
  const [toStationMode,  setToStationMode]  = useState("walk");
  const [toStationMins,  setToStationMins]  = useState("");
  const [toStationBusy,  setToStationBusy]  = useState(false);
  const [toStationError, setToStationError] = useState("");
  const [plannerNearestStation, setPlannerNearestStation] = useState(null);
  const [stationInputFocused, setStationInputFocused] = useState(false);
  const [geocodeBusy, setGeocodeBusy] = useState(false);
  const [gpsError, setGpsError] = useState("");

  // Geocode typed address → get coords → find nearest station
  const resolveOriginAndFindStation = async (address) => {
    if(!address || address.startsWith("📍")) return;
    setGeocodeBusy(true);
    try {
      const coords = await geocodeAddress(address, city.name);
      if(!coords) return;

      setPlannerLocation({lat: coords.lat.toFixed(6), lng: coords.lng.toFixed(6)});

      const local = findNearestStationLocal(coords.lat, coords.lng, city.code);
      if(local) {
        setPlannerNearestStation({name:local.n, distKm:local.distKm, line:local.line, source:"local"});
        setToStationMins("");
        autoFetchStationTime(toStationMode, local.n, {lat:coords.lat.toFixed(6), lng:coords.lng.toFixed(6)});
        return;
      }

      if(apiKey) {
        setPlannerNearestStation({name:"", source:"searching"});
        const result = await findNearestStationClaude(coords.lat, coords.lng, city, apiKey).catch(()=>null);
        if(result?.station) {
          setPlannerNearestStation({name:result.station, distKm:result.distanceKm?.toFixed?.(1)||"", line:result.line||"", source:"claude"});
          setToStationMins("");
          autoFetchStationTime(toStationMode, result.station, {lat:coords.lat.toFixed(6), lng:coords.lng.toFixed(6)});
        } else {
          setPlannerNearestStation(null);
        }
      }
    } catch(e) {
      console.warn("resolveOriginAndFindStation error:", e.message);
    } finally {
      setGeocodeBusy(false); // Always clears — no more infinite spinner
    }
  };

  // Auto-fetch routing time when mode changes (needs GPS + station)
  const autoFetchStationTime = async (mode, knownStationName, coordsOverride) => {
    let coords = coordsOverride || plannerLocation;
    if(!coords || coords.lat==="unknown") {
      try { coords = await getLocation(); setPlannerLocation(coords); }
      catch(e) { setToStationError("Enable location access to auto-fetch time."); return; }
    }
      const stationName = knownStationName
        || (plannerNearestStation?.name)
        || (plannerResult?.nearestStation)
        || "";

    setToStationBusy(true); setToStationMins(""); setToStationError("");
    try {
      let result = null;
      if(stationName) {
        result = await getStationRouteTime(parseFloat(coords.lat), parseFloat(coords.lng), stationName, city.name, mode);
      }
      if(result?.mins) {
        setToStationMins(String(result.mins));
        setToStationError(result.note ? `ℹ️ ${result.note}` : "");
      } else {
        setToStationError(stationName
          ? "Could not route to station. Verify name on Google Maps."
          : "Select a station first, then pick travel mode.");
      }
    } catch(e) {
      setToStationError("Auto-fetch failed. Check Google Maps manually.");
    }
    setToStationBusy(false);
  };

  // ── Share Journey state ──
  const [shareOpen,      setShareOpen]      = useState(false);
  const [shareRoute,     setShareRoute]     = useState(null);

  const [apiKey,       setApiKey]      = useState(()=>localStorage.getItem(API_KEY_STORAGE)||"");
  const [showKeyPanel, setShowKeyPanel]= useState(false);
  const [editingKey,   setEditingKey]  = useState(false);

  // Token tracking state (session only, resets on page reload)
  const [tokenStats, setTokenStats] = useState({used:0, saved:0, cityUsed:0});
  const [lastCached, setLastCached] = useState(false);
  const [lastCachedAge, setLastCachedAge] = useState("");
  const [activeModel, setActiveModel] = useState(ACTIVE_MODEL);

  const [from,    setFrom]    = useState("");
  const [to,      setTo]      = useState("");
  const [editFrom,setEditFrom]=useState(false);
  const [editTo,  setEditTo]  =useState(false);
  const [routes,  setRoutes]  =useState([]);
  const [loading, setLoading] =useState(false);
  const [aiError, setAiError] =useState("");
  const [searched,setSearched]=useState(false);

  const city = allCities[cityKey] || allCities["hyderabad"];
  const acc  = city.accent;
  const accB = city.accentB;
  const groups= buildGroups();

  useEffect(()=>{ const t=setInterval(()=>setTime(new Date()),1000); return()=>clearInterval(t);},[]);

  // Offline detection
  useEffect(()=>{
    const goOffline = () => { setIsOffline(true); setShowOfflineBanner(true); };
    const goOnline  = () => { setIsOffline(false); setTimeout(()=>setShowOfflineBanner(false), 3000); };
    window.addEventListener("offline", goOffline);
    window.addEventListener("online",  goOnline);
    return ()=>{ window.removeEventListener("offline",goOffline); window.removeEventListener("online",goOnline); };
  },[]);
  useEffect(()=>{ setFrom(city.defaultFrom);setTo(city.defaultTo);setRoutes([]);setSearched(false);setSelRoute(0);setAiError("");setShowKeyPanel(false);setEditingKey(false);setPlannerNearestStation(null);setPlannerLocation(null);setPlannerOrigin("");setPlannerResult(null);setToStationMins("");},[cityKey]);

  const fmtTime   =d=>d.toLocaleTimeString("en",{hour:"2-digit",minute:"2-digit",hour12:true});
  const fmtFare   =v=>(typeof v==="number"&&v%1!==0)?v.toFixed(2):String(Math.round(v));
  const swap      =()=>{const t=from;setFrom(to);setTo(t);setRoutes([]);setSearched(false);};

  // ── SOS HELPERS (need city to be defined first) ──────────────────────────
  const SOS_EMERGENCY = {
    "India":"112","United Kingdom":"999","United States":"911","Australia":"000",
    "Japan":"110","China":"110","Germany":"112","France":"15","UAE":"999",
    "Singapore":"999","Canada":"911","Brazil":"190","South Africa":"10111",
    "Nigeria":"199","Kenya":"999","Thailand":"191","Indonesia":"112",
    "Malaysia":"999","Philippines":"911","South Korea":"112","Pakistan":"15",
    "Bangladesh":"999","Sri Lanka":"119","Nepal":"100","Mexico":"911",
    "Argentina":"911","Colombia":"123","Egypt":"123","Morocco":"19",
    "Saudi Arabia":"911","Turkey":"112","Iran":"115","Italy":"112",
    "Spain":"112","Netherlands":"112","Sweden":"112","Norway":"112",
    "Poland":"112","Russia":"112","Vietnam":"113","New Zealand":"111",
    "Portugal":"112","Greece":"112","Switzerland":"117","Belgium":"112",
  };
  const cityEmergency = SOS_EMERGENCY[city.country] || "112";

  const buildSosMsg = (coords) => {
    const def = `🆘 EMERGENCY SOS from Tranzit\nI need help urgently!\n📍 Location: https://maps.google.com/?q=${coords.lat},${coords.lng}\n🌐 City: ${city.name}, ${city.country}\n⏰ Time: ${new Date().toLocaleString()}\nPlease contact emergency services: ${cityEmergency}`;
    return sosSettings.customMsg
      ? `${sosSettings.customMsg}\n\n📍 Location: https://maps.google.com/?q=${coords.lat},${coords.lng}\n⏰ ${new Date().toLocaleString()}`
      : def;
  };

  const getLocation = () => new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error("Geolocation not supported by this browser."));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      p => resolve({lat: p.coords.latitude.toFixed(6), lng: p.coords.longitude.toFixed(6)}),
      err => {
        if(err.code === 1) reject(new Error("PERMISSION_DENIED"));
        else if(err.code === 2) reject(new Error("POSITION_UNAVAILABLE"));
        else reject(new Error("TIMEOUT"));
      },
      {timeout:8000, enableHighAccuracy:true, maximumAge:30000}
    );
  });

  const sendSOS = async () => {
    const coords = await getLocation().catch(()=>({lat:"unknown",lng:"unknown"}));
    const msg    = buildSosMsg(coords);
    const phones = (sosSettings.contacts||[]).filter(c=>c&&c.phone);

    if (phones.length === 0) {
      window.location.href = `tel:${cityEmergency}`;
      setSosPhase("sent"); setSosActive(true);
      return;
    }

    // WhatsApp to first contact
    const primary = phones[0].phone.replace(/\D/g,"");
    window.open(`https://wa.me/${primary}?text=${encodeURIComponent(msg)}`, "_blank");

    // SMS to all contacts (staggered)
    phones.forEach((c, i) => {
      setTimeout(() => {
        const a = document.createElement("a");
        a.href = `sms:${c.phone.replace(/\D/g,"")}?body=${encodeURIComponent(msg)}`;
        a.click();
      }, (i+1)*1400);
    });

    setSosPhase("sent"); setSosActive(true);
  };

  const startSosCountdown = () => {
    if (!(sosSettings.contacts||[]).filter(c=>c&&c.phone).length) {
      setSosSetupOpen(true); return;
    }
    setSosModal(true); setSosPhase("countdown"); setSosCountdown(5);
    let n = 5;
    sosTimerRef.current = setInterval(() => {
      n--;
      setSosCountdown(n);
      if (n <= 0) {
        clearInterval(sosTimerRef.current);
        setSosModal(false);
        sendSOS();
      }
    }, 1000);
  };

  const cancelSosCountdown = () => {
    clearInterval(sosTimerRef.current);
    setSosModal(false); setSosPhase("idle"); setSosCountdown(5);
  };

  const handleFindRoutes = () => {
    if(!from.trim()||!to.trim()) return;

    if(isOffline) {
      const snap = loadOfflineSnapshot();

        setRoutes(snap.routes); setSelRoute(0); setSearched(true);

    try{

      );
      setRoutes(result.routes);setSelRoute(0);setSearched(true);

    }catch(e){
      if(e.message==="AUTH_FAILED"){setAiError("API key invalid or expired. Tap 'Change' to update.");localStorage.removeItem(API_KEY_STORAGE);setApiKey("");setEditingKey(true);}
      else setAiError(`Route generation failed: ${e.message}`);
    }
    setLoading(false);
  };

  // ── Journey Planner ──────────────────────────────────────────────────────
  const calcDepartureTime = async () => {
    if(!plannerDest||!plannerArrival) return;
    if(!apiKey) { setPlannerResult({error:"API key needed. Set it in ⚙️ Settings."}); return; }
    setPlannerLoading(true); setPlannerResult(null);

    // Try to get live GPS if not already fetched
    let coords = plannerLocation;
    if(!coords) {
      try {
        coords = await getLocation();
        setPlannerLocation(coords);
      } catch(e) { coords = null; }
    }

    const TO_STATION_MODES = {
      walk:  {label:"walking",      gmMode:"walking",   typical:10},
      cycle: {label:"cycling",      gmMode:"bicycling", typical:6},
      bike:  {label:"motorbike/scooter", gmMode:"driving", typical:4},
      auto:  {label:"auto-rickshaw",gmMode:"driving",   typical:7},
      car:   {label:"car/cab",      gmMode:"driving",   typical:5},
    };
    const modeInfo   = TO_STATION_MODES[toStationMode]||TO_STATION_MODES.walk;
    const minsToStn  = parseInt(toStationMins)||modeInfo.typical;

    const originDesc = plannerOrigin.trim()
      ? `Starting from: "${plannerOrigin}"`
      : coords && coords.lat !== "unknown"
        ? `Starting from: GPS coordinates ${coords.lat}, ${coords.lng}`
        : `Starting from: somewhere in ${city.name}`;

    const stationHint = plannerNearestStation?.name
      ? `The nearest metro station to the starting location (verified via OpenStreetMap) is: "${plannerNearestStation.name}". Use this as the boarding station.`
      : "";

    const osmStation = plannerNearestStation?.name || "";

    const prompt = `You are a transit expert for ${city.name}, ${city.country}.
${originDesc}.
${stationHint}
Destination: "${plannerDest}". Must arrive by: ${plannerArrival}.
Transit system: ${city.transitLabel}.

IMPORTANT travel-to-station leg:
- The person will travel from their starting location to the metro/transit station by ${modeInfo.label}.
- Estimated time to reach the station: ${minsToStn} minutes (include this in total journey and departure calculation).
- Do NOT assume they walk to the station.

Consider: peak hour crowd levels, transit frequency (every ${city.lines?.[0]?.freqMins||5} min), platform wait (~2-3 min), walk from arrival station to destination.

Respond ONLY with a valid JSON object. No markdown, no extra text.
{
  "departBy": "HH:MM AM/PM",
  "nearestStation": "boarding station name",
  "timeToStation": ${minsToStn},
  "stationDistanceKm": 0.0,
  "transitTime": 0,
  "walkFromStation": 0,
  "bufferTime": 0,
  "totalJourney": 0,
  "route": "Starting location to destination route description",
  "googleMapsQuery": "station name city",
  "tip": "practical tip",
  "peakWarning": false
}`;

    try {
      const {res} = await callWithFallback(apiKey,(modelId)=>({model:modelId,max_tokens:700,messages:[{role:"user",content:prompt}]}),null);
      const data = await res.json();
      let raw = data.content.map(b=>b.text||"").join("").trim().replace(/```json|```/g,"").trim();
      const objStart = raw.indexOf("{");
      const objEnd   = raw.lastIndexOf("}");
      if(objStart===-1) throw new Error("No JSON in response");
      const jsonStr = objEnd>objStart ? raw.slice(objStart,objEnd+1) : raw.slice(objStart)+"}";
      const obj = JSON.parse(jsonStr);
      // Override nearestStation with OSM result if we have one
      if(osmStation) obj.nearestStation = osmStation;
      setPlannerResult({...obj, _coords: coords});

      // GPS failed — show clear guidance
      const msg = e.message === "PERMISSION_DENIED"
        ? "Location access blocked. To fix: tap the 🔒 or ⓘ icon in your browser address bar → Site settings → Allow Location. Then try again."
        : e.message === "POSITION_UNAVAILABLE"
        ? "Your location could not be determined. Try moving to an open area or type your starting address manually."
        : "Location request timed out. Check your GPS/location settings and try again.";
      setGpsError(msg);
      setPlannerOrigin("");
    }
    setPlannerLocBusy(false);
  };

  // ── Share Journey ─────────────────────────────────────────────────────────
  const shareJourney = async (route) => {
    setShareRoute(route);
    const coords = await getLocation().catch(()=>null);
    const text = buildJourneyShareText(from, to, route, coords);
    if(navigator.share) {
      try { await navigator.share({title:"My Journey — Tranzit", text}); return; }
      catch(e) {}
