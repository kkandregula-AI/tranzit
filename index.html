  <!-- PWA icon generated via canvas -->
  <script>
    (function(){
      var c=document.createElement("canvas");c.width=512;c.height=512;
      var x=c.getContext("2d");

      var g=x.createLinearGradient(0,0,512,512);
      g.addColorStop(0,"#0A0A0F");g.addColorStop(1,"#1A1A28");
      x.fillStyle=g;x.beginPath();x.roundRect(0,0,512,512,96);x.fill();

      x.fillStyle=rg;x.fillRect(0,0,512,512);
      // T lettermark
      var tg=x.createLinearGradient(100,140,420,380);
      tg.addColorStop(0,"#FF6B1A");tg.addColorStop(1,"#F5A623");
      x.fillStyle=tg;
      // Horizontal bar of T
      x.beginPath();x.roundRect(90,130,332,72,18);x.fill();
      // Vertical stem of T
      x.beginPath();x.roundRect(210,130,92,252,18);x.fill();
      // Route dots — three small circles below
      [156,256,356].forEach(function(cx,i){
        x.beginPath();x.arc(cx,420,18,0,Math.PI*2);
        x.fillStyle=i===1?"#F5A623":"rgba(255,107,26,0.5)";x.fill();
      });
      // Connecting line between dots
      x.strokeStyle="rgba(245,166,35,0.4)";x.lineWidth=6;x.lineCap="round";
      x.beginPath();x.moveTo(174,420);x.lineTo(238,420);x.stroke();
      x.beginPath();x.moveTo(274,420);x.lineTo(338,420);x.stroke();
      var url=c.toDataURL("image/png");
      // Favicon
      var lnk=document.createElement("link");lnk.rel="icon";lnk.type="image/png";lnk.href=url;document.head.appendChild(lnk);
      // Apple touch icon
      var al=document.createElement("link");al.rel="apple-touch-icon";al.href=url;document.head.appendChild(al);

      var manifest={name:"Tranzit",short_name:"Tranzit",start_url:".",display:"standalone",background_color:"#0A0A0F",theme_color:"#FF6B1A",icons:[{src:url,sizes:"512x512",type:"image/png"}]};

      var ml=document.createElement("link");ml.rel="manifest";ml.href=URL.createObjectURL(mb);document.head.appendChild(ml);

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    ::-webkit-scrollbar{display:none}

    input::placeholder,textarea::placeholder{color:#6B7A99}
    select option{background:#1A1A28;color:#E8E8F0}
    @keyframes pulse   {0%,100%{opacity:1}      50%{opacity:.4}}
    @keyframes shimmer {0%,100%{opacity:.7}      50%{opacity:.3}}
    @keyframes fadeIn  {from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideUp {from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes spin    {to{transform:rotate(360deg)}}
    @keyframes glow    {0%,100%{box-shadow:0 0 8px rgba(255,107,26,.3)}50%{box-shadow:0 0 22px rgba(255,107,26,.7)}}
    .route-card {animation:fadeIn .35s ease forwards}
    .modal-sheet{animation:slideUp .35s cubic-bezier(.32,.72,0,1) forwards}
    .spin{animation:spin 1s linear infinite;display:inline-block}
    .glow{animation:glow 2s ease-in-out infinite}

// Deep link launcher with app-store fallback
function launchRideApp(app, dest) {
  const destEnc = encodeURIComponent(dest||"");
  let deep = app.deep;
  if (deep) {
    // Append destination where supported
    if (deep.includes("uber://")) deep += `&dropoff[nickname]=${destEnc}`;
    if (deep.includes("grab://")) deep += `&dropName=${destEnc}`;
    const start = Date.now();
    window.location.href = deep;
    setTimeout(() => {
      if (Date.now() - start < 2000) {
        // App didn't open — go to store
        const ua = navigator.userAgent;
        const url = /iPhone|iPad|iPod/.test(ua) ? (app.store?.ios||app.web) : (app.store?.android||app.web);
        window.open(url, "_blank");
      }
    }, 1500);
  } else {
    window.open(app.web, "_blank");
  }
}

// ── PERSISTENT ROUTE CACHE (localStorage, 24hr TTL) ──────────────────────────
const ROUTE_CACHE_STORAGE = "tranzit_route_cache_v2";
const CACHE_TTL_MS = 24 * 60 * 60 * 1000; // 24 hours

const _loadCache = () => {
  try {
    const raw = JSON.parse(localStorage.getItem(ROUTE_CACHE_STORAGE) || "{}");
    const now = Date.now();
    const valid = {};
    let purged = 0;
    Object.entries(raw).forEach(([k, v]) => {
      if (v.timestamp && (now - v.timestamp) < CACHE_TTL_MS) valid[k] = v;
      else purged++;
    });
    if (purged > 0) localStorage.setItem(ROUTE_CACHE_STORAGE, JSON.stringify(valid));
    return valid;
  } catch { return {}; }
};

// Live cache object — shared across the app, pre-loaded from localStorage
const ROUTE_CACHE = _loadCache();

const _saveCache = (key, routes, tokens) => {
  ROUTE_CACHE[key] = { routes, tokens, timestamp: Date.now() };
  try {
    localStorage.setItem(ROUTE_CACHE_STORAGE, JSON.stringify(ROUTE_CACHE));
  } catch(e) {
    // Quota exceeded — prune oldest 30% entries
    const sorted = Object.entries(ROUTE_CACHE).sort((a,b)=>a[1].timestamp-b[1].timestamp);
    sorted.slice(0, Math.ceil(sorted.length*0.3)).forEach(([k])=>delete ROUTE_CACHE[k]);
    try { localStorage.setItem(ROUTE_CACHE_STORAGE, JSON.stringify(ROUTE_CACHE)); } catch{}
  }
};

// Token counters (session only — resets on reload, but cache savings are persistent)
const TOKEN_SESSION = { used: 0, saved: 0, cityUsed: 0 };

// ── MODEL FALLBACK CHAIN ──────────────────────────────────────────────────────
// Ordered from newest → oldest. App tries each in sequence if one is deprecated/errors.
const MODEL_CHAIN = [
  { id:"claude-sonnet-4-6",   label:"Sonnet 4.6",  status:"active"  },
  { id:"claude-sonnet-4-5-20250929", label:"Sonnet 4.5", status:"active" },
  { id:"claude-opus-4-6",     label:"Opus 4.6",    status:"active"  },
  { id:"claude-haiku-4-5-20251001",  label:"Haiku 4.5",  status:"active" },
];
const MODEL_STORAGE = "tranzit_active_model";

// Active model — persisted so we don't re-probe on every reload
let ACTIVE_MODEL = (() => {
  const saved = localStorage.getItem(MODEL_STORAGE);
  const match = MODEL_CHAIN.find(m => m.id === saved);
  return match || MODEL_CHAIN[0];
})();

// Deprecated/retired HTTP status codes & error patterns
const isDeprecatedError = (status, errMsg) =>
  status === 404 ||
  (errMsg && /deprecated|retired|not found|invalid model|model_not_found/i.test(errMsg));

// Try each model in chain until one works; update ACTIVE_MODEL on success
async function callWithFallback(apiKey, bodyFn, onModelChange) {
  const startIdx = MODEL_CHAIN.findIndex(m => m.id === ACTIVE_MODEL.id);
  const orderedChain = [
    ...MODEL_CHAIN.slice(startIdx),
    ...MODEL_CHAIN.slice(0, startIdx),
  ];

  for (const model of orderedChain) {
    const body = bodyFn(model.id);
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-api-key":apiKey,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body: JSON.stringify(body)
    });

    if (res.ok) {
      // Update active model if it changed
      if (model.id !== ACTIVE_MODEL.id) {
        ACTIVE_MODEL = model;
        localStorage.setItem(MODEL_STORAGE, model.id);
        onModelChange && onModelChange(model);
      }
      return { res, model };
    }

    const errData = await res.json().catch(()=>({}));
    const errMsg  = errData.error?.message || "";

    if (res.status === 401) throw new Error("AUTH_FAILED");
    if (isDeprecatedError(res.status, errMsg)) {
      console.warn(`[Tranzit] Model ${model.id} deprecated/retired — trying next…`);
      continue; // try next model
    }
    // Other error (rate limit, server error) — throw immediately
    throw new Error(errMsg || `HTTP ${res.status}`);
  }
  throw new Error("All models in fallback chain failed. Please try again.");
}

function cacheKey(cityCode, from, to) {
  return `${cityCode}|${from.trim().toLowerCase()}|${to.trim().toLowerCase()}`;
}

// Helper: how old is a cache entry
const cacheAge = (entry) => {
  const ms = Date.now() - (entry.timestamp||0);
  if (ms < 3600000) return `${Math.round(ms/60000)}m ago`;
  if (ms < 86400000) return `${Math.round(ms/3600000)}h ago`;
  return `${Math.round(ms/86400000)}d ago`;
};

// ── AI ROUTE FETCH (persistent cache + model fallback + token tracking) ───────
async function fetchAIRoutes(city, from, to, apiKey, onTokenUpdate, onModelChange) {
  const key = cacheKey(city.code, from, to);

  // Cache HIT → return instantly, credit saved tokens
  if (ROUTE_CACHE[key]) {
    const cached = ROUTE_CACHE[key];
    TOKEN_SESSION.saved += cached.tokens || 700;
    onTokenUpdate && onTokenUpdate({ ...TOKEN_SESSION });
    return { routes: cached.routes, fromCache: true, cacheAge: cacheAge(cached), tokensSaved: cached.tokens };
  }

  const prompt = `Transit expert: ${city.name}, ${city.country}. System: ${city.transitLabel}. Currency: ${city.currency}.
5 routes from "${from}" to "${to}". Raw JSON array only, no markdown.
Each: {"id":"str","icon":"emoji","label":"name","via":"real stops","time":int,"fare":num,"crowd":int,"reliability":int,"delay":int,"co2":num,"tip":"insight"}
Use real names. Include local modes (auto/tram/ferry if applicable).`;

  const { res, model } = await callWithFallback(
    apiKey,
    (modelId) => ({ model: modelId, max_tokens: 1800, messages:[{role:"user",content:prompt}] }),
    onModelChange
  );

  const data = await res.json();
  const tokensUsed = (data.usage?.input_tokens||180) + (data.usage?.output_tokens||700);
  TOKEN_SESSION.used += tokensUsed;

  let raw = data.content.map(b=>b.text||"").join("").trim();
  raw = raw.replace(/```json\s*/gi,"").replace(/```\s*/gi,"").trim();
  const arrStart = raw.indexOf("[");
  const arrEnd   = raw.lastIndexOf("]");
  if (arrStart === -1) throw new Error("No JSON array found in response");
  let jsonStr = arrEnd > arrStart ? raw.slice(arrStart, arrEnd+1) : raw.slice(arrStart);
  if (!jsonStr.endsWith("]")) {
    const lastComma = jsonStr.lastIndexOf(",{");
    if (lastComma > 0) jsonStr = jsonStr.slice(0, lastComma);
    jsonStr = jsonStr.trimEnd().replace(/,\s*$/, "") + "]";
  }
  const routes = JSON.parse(jsonStr);
  if (!Array.isArray(routes) || routes.length === 0) throw new Error("Empty routes returned");

  _saveCache(key, routes, tokensUsed);
  onTokenUpdate && onTokenUpdate({ ...TOKEN_SESSION });
  return { routes, fromCache: false, tokensUsed, model };
}

async function generateCityConfig(cityName,country,apiKey){
  const accent = COUNTRY_ACCENTS[country]||"#4FC3F7";
  const flag   = COUNTRY_FLAGS[country]||"🌍";

  const prompt=`You are a transit data expert. Generate a complete city transit configuration for "${cityName}", ${country}.

Respond ONLY with a single valid JSON object. No markdown, no code fences, no explanation — raw JSON only.

The object must have exactly these fields:
{
  "transitLabel": "official transit authority name e.g. Transport for London, DMRC",
  "currency": "local currency symbol e.g. £ ₹ $ € ¥",
  "currencyCode": "3-letter code e.g. GBP INR USD EUR JPY",
  "timezone": "short timezone e.g. GMT IST EST JST",
  "code": "3-letter city/airport code e.g. LON DEL NYC",
  "defaultFrom": "a well-known residential area or suburb name",
  "defaultTo": "main CBD or central station name",
  "popularRoutes": [
    ["origin1","destination1"],
    ["origin2","destination2"],
    ["origin3","destination3"],
    ["origin4","destination4"]
  ],
  "lines": [
    {"line":"line name","route":"terminal A ↔ terminal B","status":"On Time","trains":12},
    {"line":"line name","route":"terminal C ↔ terminal D","status":"On Time","trains":8},
    {"line":"line name","route":"terminal E ↔ terminal F","status":"On Time","trains":6}
  ],
  "stations": [
    {"stn":"station name","pct":72,"dir":"short description"},
    {"stn":"station name","pct":85,"dir":"short description"},
    {"stn":"station name","pct":58,"dir":"short description"},
    {"stn":"station name","pct":64,"dir":"short description"}
  ],
  "alerts": [
    {"type":"warn","msg":"realistic delay or issue alert for ${cityName}"},
    {"type":"info","msg":"useful transit tip specific to ${cityName}"},
    {"type":"safe","msg":"safety or accessibility feature in ${cityName}"},
    {"type":"crowd","msg":"crowd management tip for a busy station in ${cityName}"}
  ],
  "budget": [number,number,number,number,number,number,0],
  "monthlyBudget": number
}

Rules:
- Use REAL station names, line names, and landmarks for ${cityName}
- Currency and fares must be realistic for ${cityName}, ${country}
- budget array = 7 daily spend values (Mon-Sun), last value 0 for Sunday
- monthlyBudget = realistic monthly commute budget in local currency
- Lines should be real transit lines that exist in ${cityName}
- Popular routes must be real neighbourhoods/stations in ${cityName}`;

  const {res} = await callWithFallback(
    apiKey,
    (modelId)=>({model:modelId, max_tokens:2000, messages:[{role:"user",content:prompt}]}),
    null
  );
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(res.status===401?"AUTH_FAILED":e.error?.message||`HTTP ${res.status}`);}
  const data=await res.json();
  const cityTokens=(data.usage?.input_tokens||320)+(data.usage?.output_tokens||900);
  TOKEN_SESSION.cityUsed+=cityTokens;
  TOKEN_SESSION.used+=cityTokens;
  let cityRaw=data.content.map(b=>b.text||"").join("").trim().replace(/```json\s*/gi,"").replace(/```\s*/gi,"").trim();
  const objStart=cityRaw.indexOf("{"); const objEnd=cityRaw.lastIndexOf("}");
  if(objStart===-1) throw new Error("No JSON object in city config response");
  const cityJson = objEnd>objStart ? cityRaw.slice(objStart,objEnd+1) : cityRaw.slice(objStart)+"}";
  const parsed=JSON.parse(cityJson);

  // Build full city object
  const key=slugify(cityName);
  return {
    key,
    name:cityName,
    country,
    flag,
    currency:parsed.currency||"$",
    code:parsed.code||key.slice(0,3).toUpperCase(),
    accent,
    accentB:accent+"BB",
    timezone:parsed.timezone||"UTC",
    transitLabel:parsed.transitLabel||`${cityName} Transit`,
    defaultFrom:parsed.defaultFrom||cityName,
    defaultTo:parsed.defaultTo||"City Centre",
    popularRoutes:parsed.popularRoutes||[[cityName,"City Centre"]],
    lines:parsed.lines||[],
    stations:parsed.stations||[],
    alerts:parsed.alerts||[],
    budget:parsed.budget||[0,0,0,0,0,0,0],
    monthlyBudget:parsed.monthlyBudget||200,
  };
}

      : def;
  };

  const getLocation = () => new Promise((resolve) => {
    if (!navigator.geolocation) { resolve({lat:"unknown",lng:"unknown"}); return; }
    navigator.geolocation.getCurrentPosition(
      p => resolve({lat: p.coords.latitude.toFixed(6), lng: p.coords.longitude.toFixed(6)}),
      () => resolve({lat:"unknown",lng:"unknown"}),
      {timeout:6000, enableHighAccuracy:true}
    );
  });

  const sendSOS = async () => {
    const coords = await getLocation();
    const msg    = buildSosMsg(coords);
    const phones = (sosSettings.contacts||[]).filter(c=>c&&c.phone);

    if (phones.length === 0) {
      window.location.href = `tel:${cityEmergency}`;
      setSosPhase("sent"); setSosActive(true);
      return;
    }

    // WhatsApp to first contact
    const primary = phones[0].phone.replace(/\D/g,"");
    window.open(`https://wa.me/${primary}?text=${encodeURIComponent(msg)}`, "_blank");

    // SMS to all contacts (staggered)
    phones.forEach((c, i) => {
      setTimeout(() => {
        const a = document.createElement("a");
        a.href = `sms:${c.phone.replace(/\D/g,"")}?body=${encodeURIComponent(msg)}`;
        a.click();
      }, (i+1)*1400);
    });

    setSosPhase("sent"); setSosActive(true);
  };

  const startSosCountdown = () => {
    if (!(sosSettings.contacts||[]).filter(c=>c&&c.phone).length) {
      setSosSetupOpen(true); return;
    }
    setSosModal(true); setSosPhase("countdown"); setSosCountdown(5);
    let n = 5;
    sosTimerRef.current = setInterval(() => {
      n--;
      setSosCountdown(n);
      if (n <= 0) {
        clearInterval(sosTimerRef.current);
        setSosModal(false);
        sendSOS();
      }
    }, 1000);
  };

  const cancelSosCountdown = () => {
    clearInterval(sosTimerRef.current);
    setSosModal(false); setSosPhase("idle"); setSosCountdown(5);
  };

  const handleFindRoutes = () => {
    if(!from.trim()||!to.trim()) return;
    if(!apiKey){setShowKeyPanel(true);setEditingKey(false);return;}
    doFetch();
  };

  const doFetch=async(keyOverride)=>{
    const key=keyOverride||apiKey;
    setLoading(true);setAiError("");setRoutes([]);setSearched(false);setShowKeyPanel(false);setEditingKey(false);setLastCached(false);
    try{
      const result=await fetchAIRoutes(
        city,from.trim(),to.trim(),key,
        (ts)=>setTokenStats({...ts}),
        (m)=>setActiveModel({...m})
      );
      setRoutes(result.routes);setSelRoute(0);setSearched(true);
      setLastCached(result.fromCache||false);
      setLastCachedAge(result.cacheAge||"");
    }catch(e){
      if(e.message==="AUTH_FAILED"){setAiError("API key invalid or expired. Tap 'Change' to update.");localStorage.removeItem(API_KEY_STORAGE);setApiKey("");setEditingKey(true);}
      else setAiError(`Route generation failed: ${e.message}`);
    }
    setLoading(false);
  };

  const onKeySaved=k=>{setApiKey(k);setShowKeyPanel(false);setEditingKey(false);setAiError("");if(from.trim()&&to.trim())doFetch(k);};
  const onEditKey =()=>{setEditingKey(true);setShowKeyPanel(false);setRoutes([]);setSearched(false);};

  const onCityAdded=(cfg)=>{
    const updated={...customCities,[cfg.key]:cfg};
    setCustomCities(updated);
    localStorage.setItem(CUSTOM_CITY_STORAGE,JSON.stringify(updated));
    setCityKey(cfg.key);
    setAddCityOpen(false);
    setCityModal(false);
  };

  const removeCustomCity=(key)=>{
    const updated={...customCities};
    delete updated[key];
    setCustomCities(updated);
    localStorage.setItem(CUSTOM_CITY_STORAGE,JSON.stringify(updated));
    if(cityKey===key) setCityKey("hyderabad");

  const TABS=[
    {id:"plan",   label:"Route AI",  icon:"🌐"},
    {id:"live",   label:"Live Intel",icon:"📡"},
    {id:"crowd",  label:"Crowd Map", icon:"👥"},
    {id:"rides",  label:"Ride Hub",  icon:"🚕"},

  const inp={width:"100%",background:"transparent",border:`1px solid ${acc}77`,borderRadius:8,padding:"8px 10px",color:C.text,fontSize:13,outline:"none",boxSizing:"border-box"};

  return(
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,
      backgroundImage:`radial-gradient(ellipse at 18% 0%,${acc}0E 0%,transparent 52%),radial-gradient(ellipse at 82% 92%,${accB}0B 0%,transparent 52%)`}}>

      {/* ═══ HEADER ═══ */}
      <div style={{padding:"16px 16px 12px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,background:`${C.bg}F2`,backdropFilter:"blur(14px)",zIndex:50}}>
        <div>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:28,letterSpacing:"0.08em",lineHeight:1,background:`linear-gradient(135deg,${acc},${accB})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>TRANZIT</div>
          <div style={{fontSize:9,color:C.muted,letterSpacing:"0.14em",marginTop:1}}>GLOBAL COMMUTE INTELLIGENCE</div>

          <button onClick={()=>setCityModal(true)} style={{background:`linear-gradient(135deg,${acc}22,${accB}14)`,border:`1px solid ${acc}55`,borderRadius:10,padding:"6px 10px",cursor:"pointer",color:C.text,fontSize:11,fontWeight:600,display:"flex",alignItems:"center",gap:4}}>
            <span style={{fontSize:14}}>{city.flag}</span>{city.name}<span style={{color:C.muted,fontSize:9}}>▼</span>

        </div>
      </div>

      {/* ═══ CITY MODAL ═══ */}
      {cityModal && !addCityOpen && (

          <div onClick={e=>e.stopPropagation()} className="modal-sheet" style={{width:"100%",background:"#13131D",borderRadius:"20px 20px 0 0",border:`1px solid ${C.border}`,padding:"18px 14px 0",maxHeight:"80vh",overflowY:"auto"}}>
            <div style={{textAlign:"center",marginBottom:14}}>
              <div style={{width:36,height:4,background:C.muted,borderRadius:2,margin:"0 auto 10px"}}/>

              <div style={{fontSize:10,color:C.muted,marginTop:2}}>

            {/* City groups */}
            {groups.map(g=>(

                width:"100%",background:`linear-gradient(135deg,${acc}18,${accB}0E)`,
                border:`1.5px dashed ${acc}55`,borderRadius:12,padding:"13px",
                cursor:"pointer",color:acc,fontWeight:700,fontSize:13,
                display:"flex",alignItems:"center",justifyContent:"center",gap:8,

                <span style={{fontSize:18}}>＋</span> Add New City from Listed Country with AI

            </div>
          </div>
        </div>

      {/* ═══ ADD CITY MODAL ═══ */}

          <div onClick={e=>e.stopPropagation()} className="modal-sheet" style={{width:"100%"}}>

          <div onClick={e=>e.stopPropagation()} className="modal-sheet" style={{width:"100%",background:"#13131D",borderRadius:"20px 20px 0 0",border:"1px solid rgba(255,68,102,0.3)",padding:"20px 16px 36px",maxHeight:"88vh",overflowY:"auto"}}>
            <div style={{textAlign:"center",marginBottom:18}}>
              <div style={{width:36,height:4,background:C.muted,borderRadius:2,margin:"0 auto 12px"}}/>
              <div style={{fontSize:28,marginBottom:6}}>🆘</div>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,letterSpacing:"0.1em",color:C.crimson}}>SOS SETUP</div>
              <div style={{fontSize:10,color:C.muted,marginTop:2}}>Configure emergency contacts · Saved to your device</div>
            </div>

            {/* Emergency number for city */}
            <div style={{background:"rgba(255,68,102,0.08)",border:"1px solid rgba(255,68,102,0.25)",borderRadius:11,padding:"10px 13px",marginBottom:16,display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontSize:18}}>📞</span>
              <div style={{flex:1}}>
                <div style={{fontSize:10,color:C.muted,letterSpacing:"0.08em"}}>LOCAL EMERGENCY NUMBER</div>
                <div style={{fontFamily:"'DM Mono',monospace",fontSize:18,fontWeight:700,color:C.crimson}}>{cityEmergency}</div>
                <div style={{fontSize:10,color:C.muted}}>{city.name}, {city.country}</div>
              </div>
              <button onClick={()=>window.location.href=`tel:${cityEmergency}`} style={{background:"rgba(255,68,102,0.15)",border:"1px solid rgba(255,68,102,0.4)",borderRadius:8,padding:"6px 12px",cursor:"pointer",color:C.crimson,fontSize:11,fontWeight:600}}>CALL NOW</button>
            </div>

            {/* Contacts */}
            <div style={{marginBottom:14}}>
              <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",marginBottom:10}}>👤 EMERGENCY CONTACTS (up to 3)</div>
              {[0,1,2].map(i => {
                const c = sosSettings.contacts?.[i] || {};
                return (
                  <div key={i} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:11,padding:"12px 13px",marginBottom:9}}>
                    <div style={{fontSize:10,color:C.muted,marginBottom:8}}>Contact {i+1} {i===0?"(Primary)":""}</div>
                    <input
                      placeholder="Name e.g. Ravi, Mom, Partner"
                      value={c.name||""}
                      onChange={e=>{
                        const updated=[...(sosSettings.contacts||[[],[],[]])];
                        if(!updated[i]) updated[i]={};
                        updated[i]={...updated[i],name:e.target.value};
                        saveSosSettings({...sosSettings,contacts:updated});
                      }}
                      style={{width:"100%",background:"rgba(0,0,0,0.3)",border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",color:C.text,fontSize:12,outline:"none",marginBottom:7,boxSizing:"border-box"}}/>
                    <input
                      placeholder="Phone with country code e.g. +919876543210"
                      value={c.phone||""}
                      onChange={e=>{
                        const updated=[...(sosSettings.contacts||[[],[],[]])];
                        if(!updated[i]) updated[i]={};
                        updated[i]={...updated[i],phone:e.target.value};
                        saveSosSettings({...sosSettings,contacts:updated});
                      }}
                      style={{width:"100%",background:"rgba(0,0,0,0.3)",border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",color:C.text,fontSize:12,outline:"none",boxSizing:"border-box"}}/>
                  </div>
                );
              })}
            </div>

            {/* Custom message */}
            <div style={{marginBottom:16}}>
              <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",marginBottom:8}}>💬 CUSTOM SOS MESSAGE (optional)</div>
              <textarea
                rows={3}
                placeholder={`Default: "🆘 EMERGENCY SOS — I need help! My location: [GPS link]"`}
                value={sosSettings.customMsg||""}
                onChange={e=>saveSosSettings({...sosSettings,customMsg:e.target.value})}
                style={{width:"100%",background:"rgba(0,0,0,0.3)",border:`1px solid ${C.border}`,borderRadius:9,padding:"9px 11px",color:C.text,fontSize:12,outline:"none",resize:"none",boxSizing:"border-box",lineHeight:1.6}}/>
              <div style={{fontSize:10,color:C.muted,marginTop:5}}>📍 Your live GPS coordinates are always appended automatically.</div>
            </div>

            {/* What happens on SOS */}
            <div style={{background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,borderRadius:10,padding:"11px 13px",marginBottom:16}}>
              <div style={{fontSize:10,color:C.muted,letterSpacing:"0.08em",marginBottom:7}}>⚡ WHAT HAPPENS WHEN YOU TAP SOS</div>
              {["5-second countdown (tap again to cancel)","GPS location captured automatically","WhatsApp message sent to Contact 1","SMS sent to all saved contacts","Emergency number shown for quick dial"].map((s,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:7,marginBottom:5,fontSize:11,color:C.textDim}}>
                  <span style={{color:C.crimson,fontSize:9}}>●</span>{s}
                </div>
              ))}
            </div>

            <button onClick={()=>setSosSetupOpen(false)} style={{width:"100%",background:"linear-gradient(135deg,#FF4466,#CC0033)",border:"none",borderRadius:12,padding:"13px",cursor:"pointer",fontWeight:700,fontSize:13,color:"#fff",boxShadow:"0 4px 16px rgba(255,68,102,0.4)"}}>
              ✓ Save SOS Settings
            </button>
          </div>
        </div>
      )}

      {/* ═══ SOS COUNTDOWN MODAL ═══ */}
      {sosModal && sosPhase==="countdown" && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(8px)"}}>
          <div style={{textAlign:"center",padding:"0 32px",animation:"fadeIn 0.2s ease"}}>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:88,color:C.crimson,lineHeight:1,animation:"pulse 1s infinite"}}>{sosCountdown}</div>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:24,color:"#fff",letterSpacing:"0.1em",marginBottom:8}}>SENDING SOS</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,0.6)",marginBottom:6}}>WhatsApp + SMS to your emergency contacts</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:32}}>
              {(sosSettings.contacts||[]).filter(c=>c.phone).map(c=>c.name||c.phone).join(" · ")}
            </div>
            <button onClick={cancelSosCountdown} style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.3)",borderRadius:14,padding:"13px 40px",cursor:"pointer",fontWeight:700,fontSize:14,color:"#fff",letterSpacing:"0.05em"}}>

      {sosActive && sosPhase==="sent" && (
        <div style={{margin:"10px 14px 0",background:"rgba(255,68,102,0.13)",border:"1px solid rgba(255,68,102,0.45)",borderRadius:11,padding:"11px 13px",animation:"fadeIn 0.3s ease"}}>

            <span style={{fontSize:18}}>🆘</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,color:C.crimson,fontSize:12}}>SOS SENT</div>
              <div style={{fontSize:10,color:C.textDim}}>WhatsApp + SMS dispatched with your GPS location</div>

          </div>
          <div style={{display:"flex",gap:7}}>
            <button onClick={()=>window.location.href=`tel:${cityEmergency}`} style={{flex:1,background:"linear-gradient(135deg,#FF4466,#CC0033)",border:"none",borderRadius:9,padding:"8px",cursor:"pointer",fontWeight:700,fontSize:12,color:"#fff"}}>

          <button key={tab.id} onClick={()=>setActiveTab(tab.id)} style={{flexShrink:0,transition:"all 0.2s",background:activeTab===tab.id?`linear-gradient(135deg,${acc},${accB})`:C.surface,color:activeTab===tab.id?"#000":C.textDim,border:activeTab===tab.id?"none":`1px solid ${C.border}`,borderRadius:9,padding:"7px 11px",cursor:"pointer",fontSize:11,fontWeight:activeTab===tab.id?700:400,display:"flex",alignItems:"center",gap:4}}>

      <div style={{padding:"12px 14px 180px"}}>

          <div>
            <div style={{background:C.surface,borderRadius:14,border:`1px solid ${C.border}`,padding:"13px 14px",marginBottom:10}}>
              <div style={{marginBottom:10}}>
                <div style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",marginBottom:5}}><span style={{color:C.emerald}}>●</span>&nbsp; FROM</div>

            {loading&&[1,2,3,4,5].map(i=>(<div key={i} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,padding:"14px",marginBottom:9,opacity:1.1-i*0.15,animation:"shimmer 1.4s infinite"}}><div style={{height:13,background:"rgba(255,255,255,0.06)",borderRadius:6,width:"55%",marginBottom:8}}/><div style={{height:9,background:"rgba(255,255,255,0.04)",borderRadius:6,width:"85%",marginBottom:12}}/><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8}}>{[1,2,3,4].map(j=><div key={j} style={{height:22,background:"rgba(255,255,255,0.04)",borderRadius:4}}/>)}</div></div>))}

            {aiError&&!loading&&(<div style={{background:"rgba(255,68,102,0.09)",border:"1px solid rgba(255,68,102,0.3)",borderRadius:11,padding:"12px 14px",marginBottom:10,fontSize:12,color:C.crimson,lineHeight:1.55,animation:"fadeIn 0.3s ease"}}>⚠️ {aiError}</div>)}

            {searched&&!loading&&routes.length>0&&(
              <div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{fontSize:11,color:C.textDim}}><span style={{color:C.emerald}}>●</span>&nbsp;<strong style={{color:C.text}}>{routes.length} routes</strong> · {from} → {to}</div>
                  <div style={{display:"flex",gap:5,alignItems:"center"}}>
                    {lastCached&&<div style={{fontSize:9,background:"rgba(0,212,170,0.15)",color:C.emerald,borderRadius:5,padding:"2px 7px"}}>⚡ CACHED {lastCachedAge&&`· ${lastCachedAge}`}</div>}
                    <div style={{fontSize:9,background:`${acc}20`,color:acc,borderRadius:5,padding:"2px 7px"}}>🤖 LIVE AI</div>
                  </div>
                </div>
                {routes.map((r,i)=>(
                  <div key={r.id||i} className="route-card" onClick={()=>setSelRoute(i)} style={{animationDelay:`${i*0.07}s`,background:selRoute===i?`linear-gradient(135deg,${acc}18,${accB}0A)`:C.surface,border:selRoute===i?`1px solid ${acc}66`:`1px solid ${C.border}`,borderRadius:13,padding:"12px 13px",marginBottom:9,cursor:"pointer",transition:"all 0.22s"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:20}}>{r.icon}</span>
                      <div style={{flex:1}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                          <span style={{fontWeight:600,fontSize:13}}>{r.label}</span>
                          <div style={{display:"flex",gap:5}}>
                            {r.delay>0&&<span style={{fontSize:9,background:"rgba(255,68,102,0.14)",color:C.crimson,borderRadius:5,padding:"2px 6px"}}>+{r.delay}m</span>}
                            {i===0&&<span style={{fontSize:9,background:`${acc}22`,color:acc,borderRadius:5,padding:"2px 6px"}}>✦ BEST</span>}
                          </div>
                        </div>
                        <div style={{fontSize:10,color:C.muted,marginTop:2}}>{r.via}</div>
                      </div>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,marginTop:10}}>
                      {[{l:"TIME",v:`${r.time}m`,c:C.sky},{l:"FARE",v:`${city.currency}${fmtFare(r.fare)}`,c:accB},{l:"CROWD",v:`${r.crowd}%`,c:crowdColor(r.crowd)},{l:"CO₂",v:`${r.co2}kg`,c:C.emerald}].map(m=>(<div key={m.l} style={{textAlign:"center"}}><div style={{fontSize:9,color:C.muted,letterSpacing:"0.08em"}}>{m.l}</div><div style={{fontSize:14,fontWeight:700,color:m.c,fontFamily:"'DM Mono',monospace"}}>{m.v}</div></div>))}
                    </div>
                    <div style={{marginTop:9}}>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:C.muted,marginBottom:3}}><span>Reliability</span><span>{r.reliability}%</span></div>
                      <div style={{height:3,background:"rgba(255,255,255,0.08)",borderRadius:3}}><div style={{height:"100%",width:`${r.reliability}%`,background:`linear-gradient(90deg,${acc},${accB})`,borderRadius:3}}/></div>
                    </div>
                    {selRoute===i&&r.tip&&(<div style={{marginTop:10,background:"rgba(0,212,170,0.07)",border:"1px solid rgba(0,212,170,0.15)",borderRadius:8,padding:"8px 10px",fontSize:10,color:C.textDim,lineHeight:1.65}}>🤖 {r.tip}</div>)}
                    {selRoute===i&&isRideRoute(r)&&(
                      <button onClick={e=>{e.stopPropagation();setRideHubDest(to);setRideHubOpen(true);}} style={{
                        width:"100%",marginTop:10,
                        background:`linear-gradient(135deg,${acc},${accB})`,
                        border:"none",borderRadius:10,padding:"10px",
                        cursor:"pointer",fontWeight:700,fontSize:12,color:"#000",
                        display:"flex",alignItems:"center",justifyContent:"center",gap:7,
                        boxShadow:`0 3px 12px ${acc}44`}}>
                        🚕 Book {r.label.split(" ")[0]} via Ride Hub →
                      </button>
                    )}
                  </div>
                ))}
              </div>
            )}

        {/* ── LIVE INTEL ── */}
        {activeTab==="live"&&(
          <div>
            <div style={{fontSize:11,color:C.textDim,marginBottom:10,display:"flex",alignItems:"center",gap:6}}><span style={{display:"inline-block",width:7,height:7,background:C.emerald,borderRadius:"50%",animation:"pulse 1.5s infinite"}}/>Live feed · {city.transitLabel}</div>

            {/* Next Train Timings */}
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,padding:14,marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:600,color:acc,marginBottom:8,letterSpacing:"0.08em"}}>🕐 NEXT DEPARTURES</div>
              {/* Urgency legend */}
              <div style={{display:"flex",gap:12,marginBottom:12,padding:"6px 10px",
                background:"rgba(255,255,255,0.03)",borderRadius:8}}>
                {[
                  {c:"#FF4466",l:"≤ 2 min — Hurry!"},
                  {c:"#F5A623",l:"3–5 min — Soon"},
                  {c:"#00D4AA",l:"> 5 min — Comfortable"},
                ].map((leg,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
                    <div style={{width:8,height:8,borderRadius:"50%",background:leg.c,flexShrink:0}}/>
                    <span style={{fontSize:9,color:C.muted}}>{leg.l}</span>
                  </div>
                ))}
              </div>
              {(city.lines||[]).map((l,i)=>{
                const freq = l.freqMins||5;
                const delayExtra = l.status==="Delayed"?Math.floor(Math.random()*6)+3:0;
                const now = new Date();
                const next1mins = freq+delayExtra;
                const next2mins = freq*2+delayExtra;
                const next3mins = freq*3;
                const next1 = new Date(now.getTime()+(next1mins*60000));
                const next2 = new Date(now.getTime()+(next2mins*60000));
                const next3 = new Date(now.getTime()+(next3mins*60000));
                const fmt = d=>d.toLocaleTimeString("en",{hour:"2-digit",minute:"2-digit",hour12:true});
                // Urgency color: ≤2min RED, 3–5min AMBER, >5min GREEN
                const urgencyColor = m => m<=2?"#FF4466":m<=5?"#F5A623":"#00D4AA";
                const urgencyBg    = m => m<=2?"rgba(255,68,102,0.12)":m<=5?"rgba(245,166,35,0.10)":"rgba(0,212,170,0.08)";
                const urgencyBorder= m => m<=2?"rgba(255,68,102,0.35)":m<=5?"rgba(245,166,35,0.30)":"rgba(0,212,170,0.25)";
                const urgencyLabel = m => m<=2?"NOW":"";
                return(
                  <div key={i} style={{marginBottom:i<city.lines.length-1?16:0,paddingBottom:i<city.lines.length-1?16:0,borderBottom:i<city.lines.length-1?`1px solid rgba(255,255,255,0.05)`:"none"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                      <div>
                        <div style={{fontWeight:600,fontSize:13}}>{l.line}</div>
                        <div style={{fontSize:10,color:C.muted}}>{l.route}</div>
                      </div>
                      <div style={{fontSize:10,fontWeight:600,display:"flex",alignItems:"center",gap:5,
                        color:l.status==="Delayed"?"#F5A623":C.emerald}}>
                        <span style={{width:6,height:6,borderRadius:"50%",
                          background:l.status==="Delayed"?"#F5A623":C.emerald,display:"inline-block"}}/>
                        {l.status}{delayExtra>0?` +${delayExtra}m`:""}
                      </div>
                    </div>
                    <div style={{display:"flex",gap:7}}>
                      {[
                        {label:"Next",  mins:next1mins, time:fmt(next1), primary:true},
                        {label:"Then",  mins:next2mins, time:fmt(next2), primary:false},
                        {label:"After", mins:next3mins, time:fmt(next3), primary:false},
                      ].map((t,j)=>(
                        <div key={j} style={{flex:1,
                          background:t.primary?urgencyBg(t.mins):"rgba(255,255,255,0.03)",
                          border:`1px solid ${t.primary?urgencyBorder(t.mins):C.border}`,
                          borderRadius:10,padding:"9px 8px",textAlign:"center",position:"relative",
                          transition:"all 0.3s"}}>
                          {urgencyLabel(t.mins)&&t.primary&&(
                            <div style={{position:"absolute",top:-7,left:"50%",transform:"translateX(-50%)",
                              background:"#FF4466",borderRadius:4,padding:"1px 6px",
                              fontSize:8,fontWeight:700,color:"#fff",letterSpacing:"0.06em"}}>
                              ARRIVING
                            </div>
                          )}
                          <div style={{fontSize:9,color:C.muted,letterSpacing:"0.06em",marginBottom:4}}>{t.label}</div>
                          <div style={{fontFamily:"'DM Mono',monospace",fontSize:13,fontWeight:700,
                            color:t.primary?urgencyColor(t.mins):C.textDim}}>{t.time}</div>
                          <div style={{fontSize:10,marginTop:3,fontWeight:t.primary?600:400,
                            color:t.primary?urgencyColor(t.mins):C.muted}}>
                            {t.mins<=1?"< 1 min":`${t.mins} min`}
                          </div>
                        </div>
                      ))}
                    </div>
                    <div style={{fontSize:9,color:C.muted,marginTop:7}}>Every {freq} min · {l.trains} active services</div>
                  </div>
                );
              })}
            </div>

            {/* Live Alerts */}
            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:600,color:acc,marginBottom:9,letterSpacing:"0.08em"}}>📡 LIVE ALERTS</div>
              {(city.alerts||[]).map((a,i)=>(<div key={i} style={{background:C.surface,border:`1px solid ${C.border}`,borderLeft:`3px solid ${a.type==="warn"?accB:a.type==="safe"?C.emerald:a.type==="crowd"?acc:C.sky}`,borderRadius:11,padding:"11px 13px",marginBottom:9}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:13}}>{alertIcon(a.type)}</span><span style={{fontSize:9,color:C.muted}}>{["2 min ago","5 min ago","Just now","Now"][i]}</span></div><div style={{fontSize:12,lineHeight:1.55}}>{a.msg}</div></div>))}
            </div>

            {/* Line Status */}
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,padding:14}}>
              <div style={{fontSize:11,fontWeight:600,color:acc,marginBottom:11,letterSpacing:"0.08em"}}>🚉 {city.transitLabel?.toUpperCase()} — LINE STATUS</div>
              {(city.lines||[]).map((l,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:i<(city.lines.length-1)?`1px solid rgba(255,255,255,0.05)`:"none"}}><div><div style={{fontWeight:600,fontSize:12}}>{l.line}</div><div style={{fontSize:10,color:C.muted}}>{l.route}</div></div><div style={{textAlign:"right"}}><div style={{fontSize:11,color:statusClr(l.status),fontWeight:600}}>{l.status}</div><div style={{fontSize:9,color:C.muted}}>{l.trains} active · every {l.freqMins}m</div></div></div>))}
            </div>
          </div>
        )}

        {/* ── CROWD MAP ── */}
        {activeTab==="crowd"&&(
          <div>
            <div style={{fontSize:11,color:C.textDim,marginBottom:10}}>Platform density · {city.name} · {fmtTime(time)}</div>

            {/* Sample data disclaimer */}
            <div style={{background:"rgba(245,166,35,0.10)",border:"1px solid rgba(245,166,35,0.35)",
              borderRadius:11,padding:"10px 13px",marginBottom:13,
              display:"flex",alignItems:"flex-start",gap:9}}>
              <span style={{fontSize:16,flexShrink:0}}>⚠️</span>
              <div>
                <div style={{fontSize:11,fontWeight:700,color:"#F5A623",marginBottom:3,letterSpacing:"0.04em"}}>
                  SAMPLE DATA — FOR ILLUSTRATION ONLY
                </div>
                <div style={{fontSize:10,color:C.textDim,lineHeight:1.65}}>
                  Station crowd levels and coach occupancy shown here are <strong style={{color:C.text}}>demo values</strong>, not live figures.
                  Real-time crowd data via official transit APIs (HMRL, DMRC, TfL, MTA etc.) will be integrated in the <strong style={{color:"#F5A623"}}>next build</strong>.
                </div>
              </div>
            </div>
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,padding:14,marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:600,color:acc,marginBottom:12,letterSpacing:"0.08em"}}>📍 STATION CROWD LEVELS</div>
              {(city.stations||[]).map((s,i)=>(<div key={i} style={{marginBottom:13}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:5}}><div><span style={{fontWeight:600}}>{s.stn}</span><span style={{fontSize:9,color:C.muted,marginLeft:7}}>{s.dir}</span></div><span style={{fontFamily:"'DM Mono',monospace",color:crowdColor(s.pct),fontWeight:600}}>{s.pct}%</span></div><div style={{height:5,background:"rgba(255,255,255,0.08)",borderRadius:4}}><div style={{height:"100%",width:`${s.pct}%`,background:`linear-gradient(90deg,${crowdColor(s.pct)}88,${crowdColor(s.pct)})`,borderRadius:4}}/></div><div style={{fontSize:9,color:crowdColor(s.pct),marginTop:2}}>{s.pct>85?"⚠ VERY CROWDED":s.pct>65?"BUSY":"✓ CLEAR"}</div></div>))}
            </div>

            {/* Dynamic coaches from city data */}
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,padding:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <div style={{fontSize:11,fontWeight:600,color:acc,letterSpacing:"0.08em"}}>🚃 COACH OCCUPANCY</div>
                <div style={{fontSize:9,color:C.muted}}>{(city.coaches||[]).length} coaches · {city.lines?.[0]?.line||""}</div>
              </div>
              {/* Legend */}
              <div style={{display:"flex",gap:12,marginBottom:12}}>
                {[{c:"#00D4AA",l:"Clear"},{c:"#F5A623",l:"Busy"},{c:"#FF4466",l:"Packed"},{c:"rgba(100,150,255,0.8)",l:"Special"}].map((le,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:4}}>
                    <div style={{width:8,height:8,borderRadius:"50%",background:le.c}}/>
                    <span style={{fontSize:9,color:C.muted}}>{le.l}</span>
                  </div>
                ))}
              </div>
              <div style={{display:"grid",gridTemplateColumns:`repeat(${Math.min((city.coaches||[]).length,4)===1?1:Math.min((city.coaches||[]).length,4)>=3?3:2},1fr)`,gap:8}}>
                {(city.coaches||[]).map((c,i)=>{
                  const col = c.special?"rgba(100,150,255,0.85)":crowdColor(c.p);
                  return(
                    <div key={i} style={{textAlign:"center",background:"rgba(255,255,255,0.02)",borderRadius:10,padding:"10px 6px",border:`1px solid ${c.special?"rgba(100,150,255,0.2)":C.border}`}}>
                      <div style={{fontSize:9,color:c.special?"rgba(150,180,255,0.8)":C.muted,marginBottom:6,fontWeight:c.special?600:400}}>{c.l}</div>
                      <div style={{width:42,height:42,borderRadius:"50%",margin:"0 auto 6px",
                        background:`conic-gradient(${col} ${c.p*3.6}deg,rgba(255,255,255,0.08) 0)`,
                        display:"flex",alignItems:"center",justifyContent:"center"}}>
                        <div style={{width:28,height:28,borderRadius:"50%",background:C.surface,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'DM Mono',monospace",fontSize:10,fontWeight:600,color:col}}>{c.p}%</div>
                      </div>
                      <div style={{fontSize:8,color:col,fontWeight:600}}>
                        {c.special&&c.note?c.note:c.p>85?"PACKED":c.p>65?"BUSY":"CLEAR"}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        {/* ── RIDE HUB TAB ── */}
        {activeTab==="rides"&&(()=>{
          const apps = RIDE_APPS[city.country] || RIDE_APPS["_default"];
          const modes = [...new Set(apps.map(a=>a.mode.split("/")[0]))];
          return (
            <div>
              {/* Hero */}
              <div style={{background:`linear-gradient(135deg,${acc}18,${accB}0C)`,
                border:`1px solid ${acc}33`,borderRadius:16,padding:"16px",marginBottom:14,textAlign:"center"}}>
                <div style={{fontSize:32,marginBottom:6}}>🚕</div>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:"0.08em",
                  background:`linear-gradient(135deg,${acc},${accB})`,
                  WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
                  RIDE BOOKING HUB
                </div>
                <div style={{fontSize:11,color:C.textDim,marginTop:4}}>
                  {apps.length} ride apps for {city.name} · Tap to open &amp; book instantly
                </div>
                <div style={{display:"flex",gap:6,justifyContent:"center",marginTop:10,flexWrap:"wrap"}}>
                  {modes.map(m=>(
                    <span key={m} style={{fontSize:10,background:`${acc}20`,color:acc,
                      borderRadius:6,padding:"3px 9px",fontWeight:600}}>{m}</span>
                  ))}
                </div>
              </div>

              {/* Destination quick-fill */}
              <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,padding:"12px 14px",marginBottom:14}}>
                <div style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",marginBottom:7}}>📍 WHERE ARE YOU GOING?</div>
                <input
                  value={rideHubDest}
                  onChange={e=>setRideHubDest(e.target.value)}
                  placeholder={`e.g. ${city.defaultTo}, Airport, Hotel name…`}
                  style={{width:"100%",background:"rgba(0,0,0,0.3)",border:`1px solid ${acc}55`,
                    borderRadius:9,padding:"9px 12px",color:C.text,fontSize:13,
                    outline:"none",boxSizing:"border-box"}}/>
                <div style={{fontSize:10,color:C.muted,marginTop:5}}>
                  Share your destination with the ride app for accurate fare estimates.
                </div>
              </div>

              {/* All apps */}
              <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",marginBottom:10}}>
                AVAILABLE IN {city.name.toUpperCase()}
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:16}}>
                {apps.map((app,i)=>(
                  <div key={i} style={{background:C.surface,border:`1px solid ${C.border}`,
                    borderRadius:14,padding:"13px 14px",display:"flex",alignItems:"center",gap:12}}>
                    <div style={{width:50,height:50,borderRadius:13,flexShrink:0,
                      background:app.bg,display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:22,boxShadow:`0 4px 14px ${app.bg}66`}}>{app.icon}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:14}}>{app.name}</div>
                      <div style={{display:"flex",gap:6,marginTop:4,flexWrap:"wrap",alignItems:"center"}}>
                        <span style={{fontSize:9,background:`${acc}18`,color:acc,
                          borderRadius:5,padding:"2px 8px",fontWeight:600}}>{app.mode}</span>
                        <span style={{fontSize:10,color:C.muted}}>{app.tag}</span>
                      </div>
                    </div>
                    <button onClick={()=>{setRideHubDest(rideHubDest||to);launchRideApp(app,rideHubDest||to);}} style={{
                      flexShrink:0,background:`linear-gradient(135deg,${app.bg},${app.bg}CC)`,
                      border:"none",borderRadius:11,padding:"10px 16px",cursor:"pointer",
                      fontWeight:700,fontSize:12,color:app.fg,
                      boxShadow:`0 3px 12px ${app.bg}55`,minWidth:80,textAlign:"center"}}>
                      Open →
                    </button>
                  </div>
                ))}
              </div>

              {/* Global fallback note */}
              {!RIDE_APPS[city.country]&&(
                <div style={{background:`${acc}10`,border:`1px dashed ${acc}44`,borderRadius:10,
                  padding:"10px 13px",fontSize:11,color:C.textDim,lineHeight:1.6}}>
                  🌍 Showing global ride apps. Local apps for {city.name} will be added in future builds.
                </div>
              )}

              {/* How it works */}
              <div style={{background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,
                borderRadius:12,padding:"12px 14px",marginTop:8}}>
                <div style={{fontSize:10,fontWeight:600,color:C.text,marginBottom:8,letterSpacing:"0.08em"}}>
                  ⚡ HOW RIDE HUB WORKS
                </div>
                {[
                  {i:"1",t:"Enter your destination above (optional but recommended)"},
                  {i:"2",t:"Tap Open → to launch the ride app on your phone"},
                  {i:"3",t:"If not installed, we'll take you to the App Store / Play Store"},
                  {i:"4",t:"Your destination is pre-filled in apps that support it"},
                  {i:"5",t:"Compare fares across apps to get the best deal"},
                ].map(s=>(
                  <div key={s.i} style={{display:"flex",alignItems:"flex-start",gap:9,marginBottom:8}}>
                    <div style={{width:20,height:20,borderRadius:"50%",
                      background:`${acc}28`,border:`1px solid ${acc}55`,
                      display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:10,fontWeight:700,color:acc,flexShrink:0}}>{s.i}</div>
                    <div style={{fontSize:11,color:C.textDim,lineHeight:1.5,paddingTop:2}}>{s.t}</div>
                  </div>
                ))}
              </div>
            </div>
          );
        })()}
      </div>
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:`linear-gradient(transparent,${C.bg} 28%)`,paddingTop:10}}>

        {/* Token Intelligence Strip */}
        <div style={{margin:"0 14px 8px",background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,borderRadius:11,padding:"7px 12px",display:"flex",alignItems:"center",gap:0}}>
          <div style={{flex:1,display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:12}}>⚡</span>
            <div>
              <div style={{fontSize:9,color:C.muted,letterSpacing:"0.08em"}}>SESSION TOKENS</div>
              <div style={{fontFamily:"'DM Mono',monospace",fontSize:13,fontWeight:600,color:tokenStats.used>0?accB:C.muted}}>{tokenStats.used.toLocaleString()}</div>
            </div>
          </div>
          <div style={{width:1,height:28,background:C.border,margin:"0 10px"}}/>
          <div style={{flex:1,display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:12}}>🎯</span>
            <div>
              <div style={{fontSize:9,color:C.muted,letterSpacing:"0.08em"}}>SAVED (CACHE)</div>
              <div style={{fontFamily:"'DM Mono',monospace",fontSize:13,fontWeight:600,color:tokenStats.saved>0?C.emerald:C.muted}}>
                {tokenStats.saved>0?"+":""}{tokenStats.saved.toLocaleString()}
              </div>
            </div>
          </div>
          <div style={{width:1,height:28,background:C.border,margin:"0 10px"}}/>
          <div style={{flex:1,display:"flex",alignItems:"center",gap:5}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:C.emerald,animation:"pulse 2s infinite",flexShrink:0}}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:9,color:C.muted,letterSpacing:"0.06em"}}>MODEL</div>
              <div style={{fontFamily:"'DM Mono',monospace",fontSize:11,fontWeight:600,color:accB,
                whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                {activeModel.label}
              </div>
            </div>
            {Object.keys(ROUTE_CACHE).length>0&&(
              <button onClick={()=>{Object.keys(ROUTE_CACHE).forEach(k=>delete ROUTE_CACHE[k]);localStorage.removeItem(ROUTE_CACHE_STORAGE);setTokenStats({...TOKEN_SESSION});}} style={{background:"rgba(255,255,255,0.06)",border:`1px solid ${C.border}`,borderRadius:5,padding:"2px 5px",cursor:"pointer",color:C.muted,fontSize:8,flexShrink:0}}>
                🗑️
              </button>
            )}
          </div>
        </div>

        {/* SOS + Find Routes buttons */}
        <div style={{display:"flex",gap:8,padding:"0 14px 8px"}}>
          <div style={{display:"flex",gap:0,flex:"0 0 auto"}}>
            <button onClick={startSosCountdown} style={{
              background:sosPhase==="sent"?`linear-gradient(135deg,${C.crimson},#aa0022)`:"rgba(255,68,102,0.13)",
              border:`1px solid ${C.crimson}`,color:C.crimson,
              borderRadius:"12px 0 0 12px",padding:"10px 13px",
              cursor:"pointer",fontWeight:700,fontSize:12,
              boxShadow:sosPhase==="sent"?`0 0 18px rgba(255,68,102,0.5)`:"none",
              transition:"all 0.25s"}}>
              🆘 SOS
            </button>
            <button onClick={()=>setSosSetupOpen(true)} style={{
              background:"rgba(255,68,102,0.08)",
              border:`1px solid ${C.crimson}`,borderLeft:"none",
              color:C.crimson,borderRadius:"0 12px 12px 0",
              padding:"10px 9px",cursor:"pointer",fontSize:12,
              transition:"all 0.2s"}} title="SOS Settings">
              ⚙️
            </button>
          </div>
          <button onClick={()=>activeTab==="plan"?handleFindRoutes():null}
            disabled={activeTab==="plan"&&(loading||!from.trim()||!to.trim())}
            style={{flex:1,
              background:(activeTab==="plan"&&(loading||!from.trim()||!to.trim()))
                ?"rgba(255,255,255,0.07)"
                :`linear-gradient(135deg,${acc},${accB})`,
              border:"none",borderRadius:12,padding:"12px 18px",
              cursor:(activeTab==="plan"&&(loading||!from.trim()||!to.trim()))?"not-allowed":"pointer",
              fontWeight:700,fontSize:13,
              color:(activeTab==="plan"&&(loading||!from.trim()||!to.trim()))?C.muted:"#000",
              letterSpacing:"0.02em",
              boxShadow:(activeTab==="plan"&&(loading||!from.trim()||!to.trim()))?"none":`0 4px 16px ${acc}55`,
              transition:"all 0.25s"}}>
            {activeTab==="plan"
              ? loading ? "🤖  Finding routes…"
                : `🚀 Find Routes · ${city.name}`
              : `${city.flag} ${city.name} · ${city.code}`}
          </button>
        </div>

        {/* Attribution Footer */}
        <div style={{borderTop:`1px solid ${C.border}`,padding:"8px 16px 14px",textAlign:"center"}}>
          {/* AI Model version badge */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:7,marginBottom:6}}>
            <div style={{display:"flex",alignItems:"center",gap:5,
              background:"rgba(255,255,255,0.04)",border:`1px solid ${C.border}`,
              borderRadius:8,padding:"4px 10px"}}>
              <div style={{width:6,height:6,borderRadius:"50%",background:C.emerald,
                animation:"pulse 2s infinite",flexShrink:0}}/>
              <span style={{fontSize:9,color:C.muted,letterSpacing:"0.08em"}}>AI ENGINE</span>
              <span style={{fontSize:10,fontFamily:"'DM Mono',monospace",fontWeight:600,
                color:accB}}>Claude {activeModel.label}</span>
              {activeModel.id!==MODEL_CHAIN[0].id&&(
                <span style={{fontSize:8,background:`${acc}22`,color:acc,
                  borderRadius:4,padding:"1px 5px",letterSpacing:"0.06em"}}>FALLBACK</span>
              )}
            </div>
          </div>
          <div style={{fontSize:10,color:C.muted,lineHeight:1.7}}>
            Designed by <span style={{color:acc,fontWeight:600}}>Krishnamurthy Kandregula</span> · Made by <span style={{color:accB,fontWeight:600}}>Claude</span>
          </div>
          <div style={{fontSize:9,color:"rgba(255,255,255,0.22)",letterSpacing:"0.06em",marginTop:1}}>
            KRISHNAMURTHY KANDREGULA INNOVATION LAB
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TranzitApp/>);
</script>
</body>
</html>
